name: Deploy Lambda Function

on:
  push:
    paths:
      - 'backend/lambda-processor/**'
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build Lambda package
        working-directory: ./backend/lambda-processor
        run: |
          rm -rf package lambda-function.zip
          mkdir -p package
          pip install --target package/ -r requirements.txt
          cp handler.py package/
          cd package && zip -r ../lambda-function.zip . && cd ..
          ls -lh lambda-function.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to Lambda
        working-directory: ./backend/lambda-processor
        run: |
          aws lambda update-function-code \
            --function-name inspection-report-processor \
            --zip-file fileb://lambda-function.zip \
            --region us-east-1

      - name: Verify deployment
        run: |
          aws lambda get-function \
            --function-name inspection-report-processor \
            --region us-east-1 \
            --query 'Configuration.[LastUpdateStatus,State]' \
            --output text

      - name: Check for errors
        run: |
          sleep 10
          aws logs filter-log-events \
            --log-group-name /aws/lambda/inspection-report-processor \
            --region us-east-1 \
            --start-time $(($(date +%s) - 60))000 \
            --filter-pattern "ERROR" \
            --max-items 5 || echo "No errors found"
