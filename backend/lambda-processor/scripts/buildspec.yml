version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing dependencies..."
  build:
    commands:
      - echo "Building Lambda package..."
      - mkdir -p package
      - pip3 install --target package/ -r requirements.txt
      - cp handler.py package/
      - cd package && zip -r ../lambda-function.zip . && cd ..
      - ls -lh lambda-function.zip
artifacts:
  files:
    - lambda-function.zip
  name: lambda-package
