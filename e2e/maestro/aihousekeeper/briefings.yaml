appId: com.symply.house
tags:
  - app:house
  - feature:aihousekeeper
  - readonly
  - regression
# Matrix: HOUSE-AIHK-001…003, 006…007, 011…012, 015…019, 022…028
---
- runFlow: ../subflows/launch-logged-in.yaml
- openLink: simplehouse://aihousekeeper-briefings
- extendedWaitUntil:
    visible:
      id: 'aihousekeeper-briefings-screen'
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: 'Briefings'
    timeout: 30000
- runFlow:
    when:
      visible: 'No briefings yet'
    commands:
      - assertVisible: 'No briefings yet'
