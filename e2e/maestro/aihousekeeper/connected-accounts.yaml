# until fixed (see audit §D / §0.4).
- runFlow: ../subflows/launch-logged-in.yaml
- openLink: simplehouse://aihousekeeper-connected-accounts
- extendedWaitUntil:
    visible: 'Connected accounts'
    timeout: 30000
