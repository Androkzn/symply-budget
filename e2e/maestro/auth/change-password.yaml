appId: com.symply.house
tags:
  - app:house
  - feature:auth
  - mutation
  - regression
# Matrix: HOUSE-AUTH-029
---
# Change password — drives Profile when the row exists; otherwise documents UI gap.
- runFlow: ../subflows/e2e-matrix-before.yaml
- runFlow: ../subflows/launch-logged-in.yaml
- runFlow: ../subflows/open-profile.yaml
- runFlow:
    when:
      visible: 'Change Password'
    commands:
      - scrollUntilVisible:
          element:
            text: 'Change Password'
          direction: DOWN
          timeout: 15000
      - tapOn: 'Change Password'
- runFlow: ../subflows/e2e-matrix-after.yaml
