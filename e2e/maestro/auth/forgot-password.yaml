appId: com.symply.house
tags:
  - app:house
  - feature:auth
  - mutation
  - regression
# Matrix: HOUSE-AUTH-010
---
- runFlow: ../subflows/e2e-matrix-before.yaml
- runFlow: ../subflows/launch-logged-out.yaml
# Clear the observability ring buffers HERE — while the app is still parked on
# Login — and NOT later from the Reset Password screen. Ordering is load-bearing.
#
# `e2e-clear-log` is delivered as a real deep link (`simplehouse://e2e-clear-log`).
# `tryHandleE2ETestDeepLink` consumes it and returns true
# (src/services/e2e-test-deeplinks.ts:89), but that return value only
# short-circuits OUR handler chain in app/_layout.tsx. React Navigation's own
# linking listener is subscribed to the same `Linking` url event independently,
# never sees that `true`, resolves `e2e-clear-log` against the route tree,
# matches nothing — and RESETS the stack to its initial route, which on a
# logged-out app is Login.
#
# So firing this while parked on a PUSHED screen destroys the flow's navigation
# state. Reproduced 2026-09-01 with this block sitting between `hideKeyboard`
# and the submit tap: `assertVisible: Reset Password`, the email tap and the
# `inputText` all COMPLETED, the link fired, and the very next step died with
# "Element not found: auth-forgot-submit" — the failing step's hierarchy showed
# a full-screen `login-screen` with an EMPTY `auth-email-input`, i.e. the auth
# stack had been reset and the typed email thrown away. It reads as a missing
# button and is actually a navigation reset.
#
# login-validation.yaml fires the identical link mid-flow and survives only
# because Login IS its initial route there, so the reset is a no-op. Reset
# Password is pushed, so this flow has to clear BEFORE it navigates.
#
# Moving it up costs the assertion nothing. What the clear protects is the
# `e2e-verify-network` check below: `findE2ENetworkEntryBySpec` returns the most
# recent MATCHING entry, so a `POST /auth/forgot-password 200` left in the buffer
# by an earlier flow or re-run would PASS without this submit ever firing.
# Everything between here and the submit tap is two navigation taps and a text
# input — nothing touches that endpoint — so the buffer is still guaranteed free
# of it at the moment the tap happens.
- runFlow:
    file: ../subflows/e2e-clear-log.yaml
    env:
      E2E_APP_SCHEME: simplehouse
      APP_ID: com.symply.house
# Paired with the openLink above: the deep link can raise Expo Dev Client chrome.
- runFlow: ../subflows/dismiss-expo-dev-chrome.yaml
- tapOn:
    id: 'auth-sign-in-email'
- tapOn:
    id: 'auth-forgot-password'
- extendedWaitUntil:
    visible: 'Reset Password'
    timeout: 10000
- tapOn:
    id: 'auth-forgot-email-input'
- inputText: ${E2E_EMAIL}
# NOT `hideKeyboard`. It fails outright on iPad — Maestro reports "Couldn't hide
# the keyboard … the app uses a custom input or doesn't expose a standard dismiss
# action" — and a bare (non-optional) `hideKeyboard` ABORTS the whole flow. The
# iPad keyboard carries chrome the iPhone one does not: an `inputAssistantView`
# autofill bar, a `Done` return key, and a separate `Hide keyboard` key.
# Same idiom as `login-validation.yaml` and `house-adopt-or-start-home.yaml`:
# tap a neutral point instead. It dismisses because the form's ScrollView sets
# `keyboardShouldPersistTaps="handled"`, so a tap no child handles falls through.
- tapOn:
    point: '50%,12%'
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: 'auth-forgot-submit'
- extendedWaitUntil:
    visible: 'Check Your Email'
    timeout: 30000
# authApi.forgotPassword → POST /auth/forgot-password (src/api/auth.ts:83-86).
- runFlow:
    file: ../subflows/e2e-verify-network.yaml
    env:
      E2E_APP_SCHEME: simplehouse
      APP_ID: com.symply.house
      E2E_VERIFY_METHOD: POST
      E2E_VERIFY_PATH: /auth/forgot-password
      E2E_VERIFY_STATUS: '200'
- runFlow: ../subflows/dismiss-expo-dev-chrome.yaml
- extendedWaitUntil:
    visible:
      id: 'e2e-verify-badge'
      text: '^PASS'
    timeout: 5000
- runFlow: ../subflows/e2e-matrix-after.yaml
