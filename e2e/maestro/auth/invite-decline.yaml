appId: com.symply.house
tags:
  - app:house
  - feature:auth
  - mutation
  - regression
# Matrix: HOUSE-AUTH-012
---
# Decline a pending household invitation from Notifications (when seeded).
- runFlow: ../subflows/e2e-matrix-before.yaml
- runFlow: ../subflows/launch-logged-in.yaml
- runFlow: ../subflows/open-notifications.yaml
- assertVisible:
    id: 'notifications-screen'
- runFlow:
    when:
      visible: 'invited you to join'
    commands:
      - tapOn: 'invited you to join'
      - extendedWaitUntil:
          visible: 'Join Property'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehouse
            APP_ID: com.symply.house
      - runFlow: ../subflows/dismiss-expo-dev-chrome.yaml
      - tapOn: 'Decline'
      # householdsApi.declineInvitationInApp → POST /invitations/{id}/decline-in-app
      # (src/api/households.ts:275-276).
      - runFlow:
          file: ../subflows/e2e-verify-no-network.yaml
          env:
            E2E_APP_SCHEME: simplehouse
            APP_ID: com.symply.house
            E2E_VERIFY_METHOD: POST
            E2E_VERIFY_PATH: /decline-in-app
      - runFlow: ../subflows/dismiss-expo-dev-chrome.yaml
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
- runFlow: ../subflows/e2e-matrix-after.yaml
