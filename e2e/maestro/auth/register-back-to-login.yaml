appId: com.symply.house
tags:
  - app:house
  - feature:auth
  - readonly
  - regression
# Matrix: HOUSE-AUTH-024
---
# Register → back — Login restored, no account created.
- runFlow: ../subflows/launch-logged-out.yaml
- tapOn:
    id: 'auth-go-register'
- extendedWaitUntil:
    visible: 'Create Account'
    timeout: 15000
- tapOn:
    id: 'auth-register-back'
- extendedWaitUntil:
    visible:
      id: 'auth-sign-in-email'
    timeout: 15000
- assertVisible:
    id: 'auth-go-register'
