appId: com.symply.budget
tags:
  - util
  - app:budget
  - feature:multi-member
---
# Point the Expo Dev Client at THIS suite's Metro.
#
# Not `../subflows/connect-budget-metro.yaml`: that one hardcodes :8082, which
# is the port the single-device Budget suite uses. This suite deliberately runs
# its own Metro on another port, and tapping an ":8082" entry in the dev-client
# server list would attach these devices to a DIFFERENT session's bundler —
# silently testing someone else's bundle, or hanging on their reload.
#
# env: MM_METRO_PORT, E2E_METRO_DEVCLIENT_URL (already carries the right URL)
- runFlow:
    when:
      visible: 'DEVELOPMENT SERVERS'
    commands:
      - tapOn:
          text: '.*${MM_METRO_PORT}.*'
          optional: true
      - tapOn:
          text: '.*:${MM_METRO_PORT}'
          optional: true
      - tapOn:
          text: '.*localhost.*${MM_METRO_PORT}.*'
          optional: true
      # The deep link encodes host+port explicitly, so it is authoritative even
      # when nothing in the list matched.
      - openLink: ${E2E_METRO_DEVCLIENT_URL}
      - waitForAnimationToEnd:
          timeout: 15000
- runFlow: ../subflows/budget-dismiss-expo-dev-chrome.yaml
