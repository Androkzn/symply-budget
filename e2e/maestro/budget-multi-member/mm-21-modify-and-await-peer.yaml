appId: com.symply.budget
tags:
  - app:budget
  - feature:local-first
  - feature:multi-member
  - mutation
# Matrix: BUDGET-MM-021 — MODIFY an existing row and see the peer's
# modification arrive. Runs on BOTH devices AT THE SAME TIME.
#
# Creation propagating is not the same guarantee as an edit propagating: a
# create inserts a whole row, an edit ships only the changed fields and has to
# land on a row the peer already holds. Each member edits the row THEY created
# (different rows, so no conflict), then waits for the peer's new value.
#
# env:
#   MM_SECTION      spending | planning — where this member's own row lives
#   MM_TITLE        this member's row
#   MM_AMOUNT       its new amount
#   MM_PEER_SECTION where the peer's row lives
#   MM_PEER_TITLE   the peer's row
#   MM_PEER_AMOUNT        the value the peer types into the form
#   MM_PEER_AMOUNT_SHOWN  how that value RENDERS in the list (e.g. $77)
---
- runFlow: ../subflows/budget-dismiss-expo-dev-chrome.yaml
# A stale app alert survives across flows AND runs (no clearState) and
# swallows every tap while staying invisible to assertions.
- runFlow: mm-dismiss-stale-alerts.yaml
# An abandoned item form from a previous flow/run hides the list entirely.
- runFlow: mm-leave-item-form.yaml
- runFlow:
    when:
      true: ${MM_SECTION == 'planning'}
    commands:
      - runFlow: ../subflows/budget-go-planning.yaml
- runFlow:
    when:
      true: ${MM_SECTION == 'spending'}
    commands:
      - runFlow: ../subflows/go-budget-tab.yaml
      - tapOn:
          id: 'tab-spending'
      - extendedWaitUntil:
          visible:
            id: 'budget-spendings'
          timeout: 20000
- extendedWaitUntil:
    visible: '.*${MM_TITLE}.*'
    timeout: 25000
# Tap the ROW to edit it, rather than fishing for the swipe action.
#
# The swipe tray reveals its actions from the right, so a short swipe exposes
# only the trailing ones — Edit is first in the group and stayed off-screen,
# which is why the tap could not find `budget-edit-spent`. The row itself is
# wired to the same handler (onPress -> handleEditExpense/handleEditPlanned),
# so this is both sturdier and closer to how a member actually opens an entry.
- tapOn:
    text: '.*${MM_TITLE}.*'
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible:
      id: 'budget-item-form'
    timeout: 25000
# The form opens with Name autofocused and the keyboard up, and the Cost field
# sits BEHIND that keyboard — a tap aimed at Cost lands on a key, focus stays in
# Name, and every step after it edits the wrong field. Close the keyboard, then
# bring Cost into view, before touching it.
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: 'budget-item-cost-exact'
    direction: DOWN
    centerElement: true
    timeout: 10000
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: 'budget-item-cost-exact'
    retryTapIfNoChange: true
- eraseText: 12
- inputText: ${MM_AMOUNT}
# Blur the COST field against the visible "Cost" LABEL.
#
# Save is gated on isDirty, and isDirty only flips when the typed value reaches
# RN state — which happens in the field's onEndEditing, i.e. on blur. Two
# earlier attempts failed here: `pressKey: Enter` does nothing because a
# decimal-pad keyboard has no return key, and tapping the title field misses
# because the form is scrolled to centre Cost, leaving Title off-screen. The
# section label sits right beside the field, is always visible, and is a plain
# <Text>, so the tap blurs instead of moving focus to another input.
# (Confirmed via idb: Save enabled=False while the field already read 77.45.)
- tapOn:
    text: '^Cost$'
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: 'budget-item-form-save-header'
    direction: DOWN
    timeout: 8000
    optional: true
- tapOn:
    id: 'budget-item-form-save-header'
- waitForAnimationToEnd:
    timeout: 2500
- runFlow: ../subflows/budget-dismiss-expo-dev-chrome.yaml
- extendedWaitUntil:
    notVisible:
      id: 'budget-item-form'
    timeout: 25000
- runFlow: ../subflows/budget-sync-pulse.yaml
- waitForAnimationToEnd:
    timeout: 6000
- runFlow: mm-dismiss-stale-alerts.yaml
- runFlow: ../subflows/budget-relaunch-if-backgrounded.yaml

# Now wait for the peer's edit to land on this device.
- runFlow:
    when:
      true: ${MM_PEER_SECTION == 'planning'}
    commands:
      - runFlow: ../subflows/budget-go-planning.yaml
- runFlow:
    when:
      true: ${MM_PEER_SECTION == 'spending'}
    commands:
      - runFlow: ../subflows/go-budget-tab.yaml
      - tapOn:
          id: 'tab-spending'
      - extendedWaitUntil:
          visible:
            id: 'budget-spendings'
          timeout: 20000
- extendedWaitUntil:
    visible: '.*${MM_PEER_TITLE}.*'
    timeout: 30000
- repeat:
    times: 20
    commands:
      - runFlow:
          when:
            notVisible: '.*${MM_PEER_AMOUNT_SHOWN}.*'
          commands:
            - runFlow: ../subflows/budget-sync-pulse.yaml
            - waitForAnimationToEnd:
                timeout: 6000
            - runFlow: mm-dismiss-stale-alerts.yaml
            - runFlow: ../subflows/budget-relaunch-if-backgrounded.yaml
            - runFlow: ../subflows/budget-dismiss-expo-dev-chrome.yaml
# Match the rendered DOLLARS, and pass them WITHOUT the "$".
#
# Two traps here, both hit for real:
#  * the list renders whole dollars ("$63"), not the cents the form takes
#    ("63.21"), and it ROUNDS — 88.88 shows as "$89";
#  * these selectors are regexes, so a literal "$" is an end-of-line anchor and
#    ".*$88.*" can never match anything.
# So MM_PEER_AMOUNT_SHOWN carries just the digits, e.g. "63".
- extendedWaitUntil:
    visible: '.*${MM_PEER_AMOUNT_SHOWN}.*'
    timeout: 30000
- assertVisible: '.*${MM_PEER_TITLE}.*'
- assertVisible: '.*${MM_PEER_AMOUNT_SHOWN}.*'
