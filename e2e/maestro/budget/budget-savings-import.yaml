appId: com.symply.budget
tags:
  - app:budget
  - feature:savings
  - mutation
  - regression
# Matrix: BUDGET-savings (see documents/engineering/testing/matrices/)
# Savings AI import (SavingsImportScreen, wrapped in AIAccessGate) → REAL photo
# upload + analyze. Opens the importer, attaches a seeded photo via the gallery
# tile (savings-import-gallery → native photo picker), types a supporting prompt,
# then runs Analyze and asserts the parsed draft ("Review and edit…" + the
# savings-import-save control). Nothing is committed — the flow leaves before Save.
#
# NOTE: if the AI-access gate is not satisfied the screen renders a paywall/gate
# instead of savings-import, so the container assertion is guarded (optional) and
# the flow no-ops past the analyze step in that case.
#
# Entry point moved off the Monthly tab itself (2026-08-05): there is no
# savings-monthly-ai-import control anywhere in SavingsMonthlyView.tsx — the
# "import a bills sheet" copy in its empty state is descriptive text only, not
# a button (reproduced when the shared marathon test account had accumulated
# 29 recurring payments, well past that empty state, and the assert timed out
# after 15s with zero backend activity — the target never existed, not a
# timing issue). Per SavingsRecurringPaymentsScreen.tsx:1099-1111 (added by the
# "streamline payment addition" refactor), the real path is Monthly -> Manage
# -> the "+" add menu -> "Import with AI". Updated to match, including the
# extra screen this adds to the back-navigation chain at the end.
---
- runFlow: ../subflows/budget-launch-logged-in.yaml
- runFlow: ../subflows/go-budget-tab.yaml
- runFlow:
    file: ../subflows/budget-e2e-matrix-before.yaml
    env:
      E2E_APP_SCHEME: simplebudget
      APP_ID: com.symply.budget
      E2E_MATRIX_ROW: BUDGET-SAV-IMPORT
- runFlow: ../subflows/go-budget-savings.yaml
- tapOn:
    id: 'filter-tab-monthly'
- extendedWaitUntil:
    visible:
      id: 'savings-monthly'
    timeout: 15000
- tapOn:
    id: 'savings-monthly-add'
- extendedWaitUntil:
    visible:
      id: 'savings-recurring-payments'
    timeout: 15000
- tapOn:
    id: 'savings-recurring-add'
# Android: the Expo dev-client menu has been observed popping open around
# this point (cause not fully pinned down), covering the form. Clear it
# before waiting on the form's own content.
- runFlow: ../subflows/budget-dismiss-expo-dev-chrome.yaml
- extendedWaitUntil:
    visible:
      id: 'savings-recurring-add-import'
    timeout: 8000
- tapOn:
    id: 'savings-recurring-add-import'
- extendedWaitUntil:
    visible:
      id: 'savings-import'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: 'savings-import'
    commands:
      - assertVisible:
          id: 'savings-import-gallery'
      - assertVisible:
          id: 'savings-import-file'
      - assertVisible:
          id: 'savings-import-analyze'
      # Android has no CoreSimulator-equivalent host-side fixture seeding
      # (scripts/e2e/seed-fixtures.sh is iOS-only) — the gallery is otherwise
      # empty ("No photos yet"), so push the fixture in directly. iOS already
      # has this seeded before the suite runs, so skip there to avoid
      # duplicating the well-tested existing seeding path.
      - runFlow:
          when:
            true: ${E2E_PLATFORM == 'android'}
          commands:
            - addMedia:
                - ../../../resourses/testing/Budget app - Savings.jpg
      # REAL upload: attach a seeded photo via the gallery tile.
      - tapOn:
          id: 'savings-import-gallery'
      - runFlow: ../subflows/pick-photo-from-library.yaml
      # Attachment chip (with its remove button) confirms the photo was picked.
      - extendedWaitUntil:
          visible:
            id: 'savings-import-remove-attachment'
          timeout: 20000
          optional: true
      # Add a supporting text prompt too (analyze accepts attachment and/or text).
      - scrollUntilVisible:
          element:
            id: 'savings-import-input'
          direction: DOWN
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'savings-import-input'
          commands:
            - tapOn:
                id: 'savings-import-input'
            - inputText: 'Rent 1200, Hydro 90, Internet 70'
            - hideKeyboard:
                optional: true
      - tapOn:
          id: 'savings-import-analyze'
          optional: true
      - extendedWaitUntil:
          visible:
            id: 'savings-import-save'
          timeout: 90000
          optional: true
      # Draft rendered → the Save control is present. If the async job is still
      # processing (or the model returned nothing), the screen shows a notice and
      # any alert is dismissed — neither commits data. Both are handled gracefully.
      - runFlow:
          when:
            visible: 'Still processing'
          commands:
            - assertVisible: 'Still processing'
      - tapOn:
          text: 'OK'
          optional: true
# Don't count back-taps to get home: reproduced 2026-08-05 landing on the
# Spending tab instead of Savings > Monthly after two nav-back-button taps —
# the actual stack depth from here isn't fixed (differs by whether the AI gate
# was satisfied, whether it's a paywall vs the real savings-import screen, and
# apparently doesn't reliably bottom out where a fixed tap count assumes).
# go-budget-savings.yaml's deep link is unaffected by any of that — it resets
# navigation state deterministically from wherever we are.
- runFlow: ../subflows/go-budget-savings.yaml
- tapOn:
    id: 'filter-tab-monthly'
- extendedWaitUntil:
    visible:
      id: 'savings-monthly'
    timeout: 15000

- runFlow:
    file: ../subflows/e2e-matrix-after.yaml
    env:
      E2E_APP_SCHEME: simplebudget
      APP_ID: com.symply.budget
