appId: com.symply.budget
tags:
  - app:budget
  - feature:plan
  - readonly
  - regression
# Matrix: BUDGET-PLAN-097..106 (see documents/engineering/testing/matrices/budget.md)
# Planned tab → "See all" (budget-see-all-planned) → All-planned explorer
# (BudgetAllPlanningScreen). Covers the header link, the explorer load
# (GET /budget/timeline), and its filter controls: time-range chips, search,
# sort toggle, and tap-to-filter category rows. Read-only — no writes, so it is
# safe to run before budget-auth and repeatable on any account state.
#
# The "See all" link + category rows only render when the account has planned
# items, so every interaction is guarded by `when: visible` and the flow still
# passes on an empty account.
---
- runFlow: ../subflows/budget-launch-logged-in.yaml
- runFlow: ../subflows/budget-go-planning.yaml
- assertVisible:
    id: 'budget-planned-spendings'

# Header "See all" link → All-planned explorer (guarded: needs ≥1 planned item).
- runFlow:
    when:
      visible:
        id: 'budget-see-all-planned'
    commands:
      - tapOn:
          id: 'budget-see-all-planned'
      - extendedWaitUntil:
          visible:
            id: 'budget-all-planning'
          timeout: 20000

      # Time-range scope — switch to a wider window and back (client-side windowing).
      - runFlow:
          when:
            visible:
              text: 'This year'
          commands:
            - tapOn:
                text: 'This year'
            - waitForAnimationToEnd:
                timeout: 3000
            - assertVisible:
                id: 'budget-all-planning'
      - runFlow:
          when:
            visible:
              text: 'This month'
          commands:
            - tapOn:
                text: 'This month'
            - waitForAnimationToEnd:
                timeout: 3000

      # Sort toggle (Newest ⇄ Highest).
      - runFlow:
          when:
            visible:
              id: 'budget-all-planning-sort'
          commands:
            - tapOn:
                id: 'budget-all-planning-sort'
            - waitForAnimationToEnd:
                timeout: 2000

      # Search input accepts text and filters.
      - runFlow:
          when:
            visible:
              id: 'budget-all-planning-search'
          commands:
            - tapOn:
                id: 'budget-all-planning-search'
            - inputText: 'a'
            - waitForAnimationToEnd:
                timeout: 2000
            - eraseText
            - hideKeyboard

      # Tap a category distribution row to filter (guarded — needs a categorized plan).
      - runFlow:
          when:
            visible:
              id: 'budget-all-planning-category-.*'
          commands:
            - tapOn:
                id: 'budget-all-planning-category-.*'
                index: 0
            - waitForAnimationToEnd:
                timeout: 2000
            - assertVisible:
                id: 'budget-all-planning'

      # Back to the Planning section.
      - tapOn:
          id: 'nav-back-button'
      - extendedWaitUntil:
          visible:
            id: 'budget-planned-spendings'
          timeout: 15000

- assertVisible:
    id: 'budget-planned-spendings'
