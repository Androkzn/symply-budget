appId: com.symply.budget
tags:
  - app:budget
  - feature:st
  - readonly
  - regression
  - smoke
# Matrix: BUDGET-st (see documents/engineering/testing/matrices/)
# Soft Transfer — Share a summary (SoftTransferExportScreen wrapping the
# shared SoftTransferFlowScreen, preset budget-to-house, fixedPackageId
# budget.summary.v1). Reached via the Budget Settings screen. The fixed package
# auto-advances to the consent step, so this proves that effect fires and the
# run/consent controls mount.
#
# DESTRUCTIVE GUARD: run-transfer-button / consent-confirm-button fire the real
# export/import POST chain, so this flow asserts they are reachable but never
# confirms the transfer.
---
- runFlow: ../subflows/budget-launch-logged-in.yaml
- runFlow: ../subflows/go-budget-tab.yaml
- tapOn:
    id: 'budget-settings-button'
- runFlow: ../subflows/budget-dismiss-expo-dev-chrome.yaml
- extendedWaitUntil:
    visible:
      id: 'budget-settings-screen'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'budget-settings-soft-transfer-link'
    direction: DOWN
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element:
      id: 'budget-settings-soft-transfer-export-link'
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 10
    optional: true
# scrollUntilVisible is unreliable on RN New-Arch ScrollViews under iOS 26 — fall
# back to explicit coordinate swipes to reach the settings link.
- runFlow:
    when:
      notVisible:
        id: 'budget-settings-soft-transfer-export-link'
    commands:
      - swipe:
          start: 50%, 78%
          end: 50%, 28%
      - swipe:
          start: 50%, 78%
          end: 50%, 28%
- tapOn:
    id: 'budget-settings-soft-transfer-export-link'
- extendedWaitUntil:
    visible:
      id: 'soft-transfer-flow-screen'
    timeout: 20000
# Fixed package → auto-advanced consent step. Confirm the run control is present
# (proxy for the export/import wiring) without confirming the transfer.
- scrollUntilVisible:
    element:
      id: 'run-transfer-button'
    direction: DOWN
    visibilityPercentage: 10
    timeout: 15000
    optional: true
- assertVisible:
    id: 'soft-transfer-flow-screen'
