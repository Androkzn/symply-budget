appId: com.symply.budget
tags:
  - app:budget
  - feature:plan
  - mutation
  - regression
# Matrix: BUDGET-plan (see documents/engineering/testing/matrices/)
# Budget Transfer (BudgetTransferScreen), reached via Budget Settings → Transfer.
# Asserts the transfer form loads (getTransferContext → GET /transfers) and its
# controls render; when a destination is offered, selects it and fills the amount
# via "Move all" to prove the form is wired — WITHOUT submitting (submit →
# createTransfer POST /transfers actually moves money).
---
- runFlow: ../subflows/budget-launch-logged-in.yaml
- runFlow: ../subflows/go-budget-tab.yaml
- runFlow:
    file: ../subflows/budget-e2e-matrix-before.yaml
    env:
      E2E_APP_SCHEME: simplebudget
      E2E_MATRIX_ROW: BUDGET-PLAN-015
- tapOn:
    id: 'budget-settings-button'
- runFlow: ../subflows/budget-dismiss-expo-dev-chrome.yaml
- extendedWaitUntil:
    visible:
      id: 'budget-settings-screen'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'budget-settings-transfer-link'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'budget-settings-transfer-link'
    commands:
      - swipe:
          start: '50%, 78%'
          end: '50%, 28%'
          duration: 800
      - swipe:
          start: '50%, 78%'
          end: '50%, 28%'
          duration: 800
- tapOn:
    id: 'budget-settings-transfer-link'
- extendedWaitUntil:
    visible:
      id: 'budget-transfer-screen'
    timeout: 30000
# The loading branch now renders budget-transfer-screen (spinner), so the screen
# gate resolves before GET /transfers finishes. Wait for the amount field — the
# real "form loaded" signal (only rendered once context loads and leftover > 0) —
# instead of asserting it immediately.
- extendedWaitUntil:
    visible:
      id: 'budget-transfer-amount'
    timeout: 30000
- assertVisible:
    id: 'budget-transfer-submit'
# Select a destination + fill the amount if any dest option is available.
- runFlow:
    when:
      visible:
        id: 'budget-transfer-dest-.*'
    commands:
      - tapOn:
          id: 'budget-transfer-dest-.*'
      - tapOn:
          id: 'budget-transfer-move-all'
          optional: true
- assertVisible:
    id: 'budget-transfer-screen'
- tapOn:
    id: 'back-button'
- extendedWaitUntil:
    visible:
      id: 'budget-settings-screen'
    timeout: 15000

- runFlow:
    file: ../subflows/e2e-matrix-after.yaml
    env:
      E2E_APP_SCHEME: simplebudget
