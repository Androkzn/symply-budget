    - budget-spend-select-sticky
    # Household flows run LAST (before auth), for the same reason budget-auth
    # does: they leave the device in a state the rest of the suite cannot use.
    #
    # Under BR-016 a household is a fully isolated local ledger, and creating one
    # ACTIVATES it (`handleSave` → `activateLocalBudgetHousehold`). These three
    # therefore end with an empty "E2E …" household active — and the switch flow
    # deliberately ends on an arbitrary other one. Sitting at order 40-42 they
    # left ~60 downstream flows asserting against an empty budget.
    #
    # Restoring the original household afterwards is not available: it is named
    # after the account's display name, so there is no stable string to address
    # it by. Ordering is the fix that does not depend on one.
    - budget-household-extended
    - budget-household-switch
    - budget-households
    - budget-auth
