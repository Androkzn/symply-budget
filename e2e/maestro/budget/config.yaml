# Maestro workspace — Symply Budget (com.symply.budget)
# Subflows under e2e/maestro/subflows/ are referenced via runFlow (not discovered here).
excludeTags:
  - util
  # Two-member chat stages (budget-chat-pair-*). They are meaningless in this
  # single-device suite: each one assumes a specific other-member device has
  # already run the preceding stage, and half of them must execute as the
  # SECONDARY account. Driven only by scripts/e2e/run-budget-chat-two-members.sh.
  - pair
  # Maintenance flows (budget-savings-purge-residue). They DELETE rows from the
  # shared E2E household — that is their whole job, run by name when the Monthly
  # Payments list has accumulated residue from failed runs. A destructive purge
  # that fires as part of a regression suite would take real fixtures with it,
  # so it is excluded rather than ordered.
  - maintenance
flows:
  - '**'
executionOrder:
  continueOnFailure: true
  # budget-auth clears Keychain — run it last. flowsOrder runs first in listed order;
  # list every flow explicitly so nothing runs after auth.
  flowsOrder:
    - budget-prime-session
    - budget-recover-session
    - budget-onboarding-terms
    - budget-ai-screen
    - budget-ai-providers
    - budget-ai-consent
    - budget-categories
    - budget-category-inline-create
    - budget-category-detail
    - budget-chat-assistant
    - budget-chat-extended
    - budget-chat-fab-visible
    - budget-chat-message
    - budget-chat-rooms
    - budget-consistency-golden
    - budget-corner-testids
    - budget-customize-tabs
    - budget-dashboard-controls
    - budget-dashboard-insights
    - budget-dashboard-offline
    - budget-date-sheet-check
    - budget-dashboard-widgets
    - budget-data-sharing
    - budget-deep-links
    - budget-item-form
    - budget-bulk-purchase
    - budget-local-first-sync-pulse
