    - budget-local-first-soft-transfer
    - budget-local-first-ai-detect
    - budget-local-first-mortgage-statement
    - budget-local-first-pension-import
    - budget-planned-select
    - budget-offline-sweep
    - budget-pension
    - budget-pension-interactions
    - budget-pension-offline
    - budget-plan-delete
    - budget-quick-add
    - budget-receipt-scan
    - budget-receipt-scan-save
    - budget-receipt-scan-quality
    # Runs after the other receipt flows: it leaves Region=Canada/BC and
    # Currency=CAD set on the device, which the flows above do not expect.
    - budget-receipt-foreign-currency
    - budget-savings-entry-controls
    - budget-savings-goal
    - budget-savings-goal-crud
    - budget-savings-import
    - budget-savings-income-entry
    - budget-savings-income-crud
