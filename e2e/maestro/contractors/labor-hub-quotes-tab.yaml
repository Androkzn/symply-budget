appId: com.symply.house
tags:
  - app:house
  - feature:contractors
  - readonly
  - regression
# Matrix: HOUSE-contractors (see documents/engineering/testing/matrices/)
---
# Labor-hub Quotes + Projects tabs (the quote-workflow surfaces). Exercises the dashboard
# tab bar (the only testID'd controls in the cluster) and opens the first quote row if
# present. Quote/project rows have no testID, so entry into a specific quote is best-effort.
- runFlow: ../subflows/launch-logged-in.yaml
- runFlow: ../subflows/open-contractors.yaml
- assertVisible:
    id: 'contractors-screen'
- tapOn:
    id: 'contractors-tab-quotes'
- assertVisible:
    id: 'contractors-tab-quotes'
- tapOn:
    id: 'contractors-tab-projects'
- assertVisible:
    id: 'contractors-tab-projects'
- tapOn:
    id: 'contractors-tab-upcoming'
- assertVisible:
    id: 'contractors-tab-upcoming'
# Scroll contract on the dashboard.
- runFlow:
    file: ../subflows/assert-screen-scrolls.yaml
    env:
      SCROLL_END_ID: contractors-screen-scroll-end
