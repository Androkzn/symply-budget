appId: com.symply.health
tags:
  - app:health
  - feature:local-first
  - feature:two-device
  - feature:habits
  - mutation
# Matrix: HEALTH-TD-016 — Wave A table 6/8: `userHabits` (`user_habits`).
#
# The habit DEFINITION, not its ticks — `habitLogs` is td-17, and the two are
# different tables with different id rules: `userHabits` is in
# `HEALTH_RANDOM_ID_TABLES` (no `unique()` in D1), `habitLogs` is deterministic
# on `(habit_id, date)`.
#
# ADDRESSED BY NAME, NEVER BY ID. A row's testID is its SERVER id
# (`health-habit-${habit.id}`, minted as `habit_<random>`) and is unknowable from
# a flow. The row exposes an accessibility label `Open <name>`, which is unique,
# stable, and this suite's own — the same idiom `habits-add-tick-delete.yaml`
# settled on.
#
# ⚠️ `TD_MARK` AND `TD_MARK2` MUST NOT BE SUBSTRINGS OF EACH OTHER. The modify
# leg asserts the OLD name is gone, and `TD-…-habit` / `TD-…-habit-v2` would make
# that assertion unsatisfiable. The runner mints two independent suffixes.
#
# env: TD_ROLE, TD_PHASE, TD_MARK (habit name), TD_MARK2 (renamed), TD_EXPECT
---
- runFlow: td-launch.yaml

# ==========================================================================
# WRITE — device A
# ==========================================================================
- runFlow:
    when:
      true: ${TD_ROLE == 'write'}
    commands:
      - runFlow: ../health/subflows/go-health-habits.yaml

      # --- create (quick add) ---------------------------------------------
      - runFlow:
          when:
            true: ${TD_PHASE == 'create'}
          commands:
            - scrollUntilVisible:
                element:
                  id: 'health-habit-add-button'
                direction: DOWN
                timeout: 20000
                visibilityPercentage: 10
            - tapOn:
                id: 'health-habit-name-input'
            - inputText: ${TD_MARK}
            # A plain text keyboard here, so `hideKeyboard` is safe — unlike
            # every decimal-pad field elsewhere in this suite.
            - hideKeyboard
            - tapOn:
                id: 'health-habit-add-button'
            - extendedWaitUntil:
                visible: '.*${TD_MARK}.*'
                timeout: 30000
            # The field clears on a successful add, so the add gate closes
            # again — asserted on the FIELD, which is the state the gate reads.
            - assertVisible:
                id: 'health-habit-name-input'
                text: ''

      # --- modify (rename through the detail sheet's edit form) -----------
      - runFlow:
          when:
            true: ${TD_PHASE == 'modify'}
          commands:
            - extendedWaitUntil:
                visible: '.*${TD_MARK}.*'
                timeout: 30000
            - tapOn: 'Open ${TD_MARK}'
            - extendedWaitUntil:
                visible:
                  id: 'health-habit-detail'
                timeout: 20000
            - tapOn:
                id: 'health-habit-detail-edit'
            - extendedWaitUntil:
                visible:
                  id: 'health-habit-edit-form'
                timeout: 20000
            - tapOn:
                id: 'health-habit-edit-name'
            - eraseText: 60
            - inputText: ${TD_MARK2}
            - hideKeyboard
            - tapOn:
                id: 'health-habit-edit-submit'
            - tapOn:
                id: 'health-habit-detail-close'
                optional: true
            - extendedWaitUntil:
                visible: '.*${TD_MARK2}.*'
                timeout: 30000
            - assertNotVisible: '.*${TD_MARK}.*'

      # --- delete ---------------------------------------------------------
      # Per-row delete lives in the detail sheet so a member cannot destroy a
      # habit's history with one stray tap on the list. It raises
      # `Delete habit` / `Remove "<name>" and its history?`.
      - runFlow:
          when:
            true: ${TD_PHASE == 'delete'}
          commands:
            - extendedWaitUntil:
                visible: '.*${TD_MARK2}.*'
                timeout: 30000
            - tapOn: 'Open ${TD_MARK2}'
            - extendedWaitUntil:
                visible:
                  id: 'health-habit-detail-delete'
                timeout: 20000
            - tapOn:
                id: 'health-habit-detail-delete'
            - extendedWaitUntil:
                visible: 'Remove "${TD_MARK2}" and its history\?'
                timeout: 15000
            - tapOn: '^Delete$'
            - extendedWaitUntil:
                notVisible: '.*${TD_MARK2}.*'
                timeout: 30000
            - assertNotVisible: '.*${TD_MARK2}.*'

      - runFlow: td-sync-nudge.yaml

# ==========================================================================
# OBSERVE — device B
# ==========================================================================
- runFlow:
    when:
      true: ${TD_ROLE == 'observe'}
    commands:
      - runFlow: ../health/subflows/go-health-habits.yaml
      - runFlow:
          when:
            true: ${TD_PHASE != 'delete'}
          commands:
            - repeat:
                times: 20
                commands:
                  - runFlow:
                      when:
                        notVisible: '.*${TD_EXPECT}.*'
                      commands:
                        - runFlow: td-sync-nudge.yaml
                        - runFlow: ../health/subflows/go-health-habits.yaml
                        - scrollUntilVisible:
                            element:
                              text: '.*${TD_EXPECT}.*'
                            direction: DOWN
                            timeout: 8000
                            visibilityPercentage: 10
                            optional: true
            - extendedWaitUntil:
                visible: '.*${TD_EXPECT}.*'
                timeout: 45000
            - assertVisible: '.*${TD_EXPECT}.*'
      - runFlow:
          when:
            true: ${TD_PHASE == 'delete'}
          commands:
            - repeat:
                times: 20
                commands:
                  - runFlow:
                      when:
                        visible: '.*${TD_EXPECT}.*'
                      commands:
                        - runFlow: td-sync-nudge.yaml
                        - runFlow: ../health/subflows/go-health-habits.yaml
            - extendedWaitUntil:
                notVisible: '.*${TD_EXPECT}.*'
                timeout: 45000
            - assertNotVisible: '.*${TD_EXPECT}.*'
