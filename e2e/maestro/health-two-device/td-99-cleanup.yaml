appId: com.symply.health
tags:
  - util
  - app:health
  - feature:local-first
  - feature:two-device
  - mutation
# Matrix: HEALTH-TD-099 — remove what the run created and the phases did not.
#
# Most tables clean themselves: every `td-1x` file ends its own triad on a
# delete, and those deletes are assertions, not teardown. What is left over is
# the residue of the surfaces that HAVE no delete verb, plus the fixtures the
# non-table flows minted:
#
#   • td-11's create-phase water entry (the modify-phase one is deleted by the
#     delete phase; the first one has no phase that removes it)
#   • td-17's habit fixture (`TD_HABIT`) — it owns the habit_logs rows too
#   • td-31's offline habit (`TD_OFFLINE_HABIT`)
#   • td-14's sleep entry — NOT removable: `HealthHomeWidgets` exposes no delete
#     for sleep. Documented in HEALTH_TWO_DEVICE_SYNC_E2E.md §7 rather than
#     silently left behind; it is overwritten by the next run's same-date log.
#
# Runs on BOTH devices. Deleting the same row twice is not a problem — the second
# device simply finds nothing to delete, and every step here is `optional` for
# exactly that reason. This flow must never fail a green run.
#
# It runs ONLY after a green run (the runner skips it on failure), so a red run's
# rows stay on the devices for inspection. Markers carry the run timestamp, so
# leftovers never collide with the next attempt.
#
# env: TD_HABIT, TD_OFFLINE_HABIT, TD_WATER_VALUE
---
- runFlow: td-launch.yaml

# --- habits ---------------------------------------------------------------
- runFlow: ../health/subflows/go-health-habits.yaml
- runFlow:
    when:
      visible: '.*${TD_HABIT}.*'
    commands:
      - tapOn:
          text: 'Open ${TD_HABIT}'
          optional: true
      - tapOn:
          id: 'health-habit-detail-delete'
          optional: true
      - tapOn:
          text: '^Delete$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: 'health-habit-detail-close'
          optional: true
- runFlow:
    when:
      visible: '.*${TD_OFFLINE_HABIT}.*'
    commands:
      - tapOn:
          text: 'Open ${TD_OFFLINE_HABIT}'
          optional: true
      - tapOn:
          id: 'health-habit-detail-delete'
          optional: true
      - tapOn:
          text: '^Delete$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: 'health-habit-detail-close'
          optional: true

# --- water ----------------------------------------------------------------
# The alert body names the volume, which is the only way to tell which row a
# `health-water-delete-.*` tap opened. Confirm only on a match; cancel anything
# else, so a re-run never eats a reading this suite did not write.
- runFlow: ../health/subflows/go-health-water.yaml
- runFlow:
    when:
      visible: '.*${TD_WATER_VALUE} ml.*'
    commands:
      - repeat:
          times: 4
          commands:
            - runFlow:
                when:
                  visible: '.*${TD_WATER_VALUE} ml.*'
                commands:
                  - tapOn:
                      id: 'health-water-delete-.*'
                      index: 0
                      optional: true
                  - runFlow:
                      when:
                        visible: 'Remove ${TD_WATER_VALUE} ml from today\?'
                      commands:
                        - tapOn: 'Remove'
                  - tapOn:
                      text: '^Cancel$'
                      optional: true
                  - waitForAnimationToEnd:
                      timeout: 2000

- runFlow: td-sync-nudge.yaml
