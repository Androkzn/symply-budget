    # - more-overflow-all-tabs   # needs-admin-feature-seed, see header comment
    - more-units-picker
    - more-brand-isolation
    - scroll-all-screens
    # privacy-cross-user-leak signs OUT and reinstalls, so it runs after every
    # session-dependent flow and immediately before the auth pair that
    # re-seeds the session — the auth pair does its own full
    # clearState/clearKeychain regardless, so this flow's own sign-out first
    # doesn't strand anything after it.
    - privacy-cross-user-leak
    # Session-destroying auth flows last.
    - login-screen-controls
    - login-email-submit-seeded
