    - more-customize-tabs
    - more-ai-access-entry
    # The two DATA verbs (Export, Clear all). Export is committed for real;
    # Clear-all is asserted up to (never past) its destructive confirmation —
    # this is the shared fleet account, and actually wiping it would corrupt
    # every flow that runs after it. See the flow's own header for the split.
    - more-data-safety
    - more-navigation-rows
    # - more-overflow-body-habits   # needs-admin-feature-seed, see header comment
