    # recipes-build-and-scale or each other, placed here purely to keep the
    # Recipes block contiguous.
    - recipes-log-to-diary
    - recipes-form-category-and-time
    - recipes-form-ingredient-search-and-photo
    # - fridge-stock-and-expiry   # needs-admin-feature-seed, see header comment
