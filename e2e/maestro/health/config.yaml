    # - coach-consent-and-turn   # needs-admin-feature-seed, see header comment
    # The two cards that PERSIST across the conversation coach-consent-and-turn
    # drives: the stored measurement summary and the commit ledger. Read-only,
    # so it runs straight after and needs no teardown of its own.
    # - coach-ledger-and-summary   # needs-admin-feature-seed, see header comment
    # - scan-modes-and-sources   # needs-admin-feature-seed, see header comment
    # Every control in MEAL mode (the mode scan-modes-and-sources leaves LABEL
    # mode untouched by), plus the mode-reset proof. Read-only.
    # - scan-meal-mode-controls   # needs-admin-feature-seed, see header comment
    - more-settings-controls
    # The shared tab-customization editor (5-slot cap, locked Home/More
    # slots, Save, reset) driven on Health's own pool, and the shared BYOK
    # "AI assistance" entry row — both cross-app components this brand only
    # instantiates, so each is its own flow rather than folded into
