      - scrollUntilVisible:
          element:
            id: 'health-fridge-name-input'
          direction: UP
          timeout: 20000
          visibilityPercentage: 10
      - tapOn:
          id: 'health-fridge-name-input'
      - eraseText
      - inputText: 'Maestro Kefir'
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: 'health-fridge-save-button'
          direction: DOWN
          timeout: 20000
          visibilityPercentage: 10
      # `handleSave` (editingId set) → `updateFridgeItem` (healthFridgeStorage.ts)
      # → `PUT /health/fridge/:id` (health-assets.ts), 200.
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-fridge-save-button'
      # The rename lands and the expiry the edit never touched is still there —
      # a PUT that dropped the untouched columns would show up right here.
      - scrollUntilVisible:
          element:
            text: 'Remove Maestro Kefir'
          direction: DOWN
          timeout: 20000
          visibilityPercentage: 10
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
