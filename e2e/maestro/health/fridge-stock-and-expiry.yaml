      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - assertVisible: 'ADD AN ITEM'

      - scrollUntilVisible:
          element:
            text: 'Edit Maestro Yoghurt'
          direction: DOWN
          timeout: 20000
          visibilityPercentage: 10
      - tapOn:
          id: 'health-fridge-edit-.*'
