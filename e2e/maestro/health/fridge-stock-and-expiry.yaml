            text: '^PASS'
          timeout: 5000
      - assertVisible: 'Expires in 3 days'
      - assertNotVisible: 'Remove Maestro Yoghurt'

      # --- Teardown: empty the fridge again (HEALTH-FRIDGE-113) -----------
      # Removing asks first. Each alert is a nested modal, so it is waited for
      # rather than asserted straight after the tap.
      # `handleDelete` (confirmed) → `deleteFridgeItem` (healthFridgeStorage.ts)
      # → `DELETE /health/fridge/:id` (health-assets.ts), 200 — the same call
      # backs all four removes below, each cleared and verified independently.
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-fridge-delete-.*'
          text: 'Remove Maestro Kefir'
      - extendedWaitUntil:
          visible: 'Remove item'
          timeout: 15000
      - assertVisible: 'Take "Maestro Kefir" out of your fridge?'
      - tapOn:
          text: 'Remove'
      - extendedWaitUntil:
          notVisible: 'Remove Maestro Kefir'
          timeout: 15000
      - runFlow:
