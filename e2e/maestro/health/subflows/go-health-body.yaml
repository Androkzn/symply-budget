appId: com.symply.health
tags:
  - util
  - app:health
---
# Switch to the Body tab (route health-body, label Body, header "Body").
#
# Body ships `defaultHidden` in brands/symply-health/brand.cjs, so like Cycle and
# Vitality it is reached through the More hub rather than the bar. It is the
# FIRST overflow row, so probe UP first; the tap is the hard proof.
- runFlow: go-more.yaml
- scrollUntilVisible:
    element:
      id: 'more-tab-health-body'
    direction: UP
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- scrollUntilVisible:
    element:
      id: 'more-tab-health-body'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- tapOn:
    id: 'more-tab-health-body'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'health-body-screen'
    timeout: 30000
