appId: com.symply.health
tags:
  - util
  - app:health
---
# Switch to the Cycle tab (route health-cycle, label Cycle, header "Women's Health").
#
# Unlike Nutrition / Activity / Trends there is NO `tab-health-cycle` to tap:
# Cycle ships `defaultHidden` in brands/symply-health/brand.cjs, so it lives in
# the More hub's "MORE TABS" section until the user pins it. Routing through the
# hub is the point — an unpinned tab that cannot be reached is a lost feature.
- runFlow: go-more.yaml
# The overflow rows sit at the TOP of the More screen, so a preceding flow may
# have left the list scrolled past them. Probe both directions before tapping;
# the tap itself is the hard proof, not the scroll.
- scrollUntilVisible:
    element:
      id: 'more-tab-health-cycle'
    direction: UP
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- scrollUntilVisible:
    element:
      id: 'more-tab-health-cycle'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- tapOn:
    id: 'more-tab-health-cycle'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'health-cycle-screen'
    timeout: 30000
