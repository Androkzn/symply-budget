appId: com.symply.health
tags:
  - util
  - app:health
---
# Switch to the Workouts tab (route health-exercises, label Workouts, header
# "Workouts").
#
# Unlike Nutrition / Activity / Trends there is NO `tab-health-exercises` to tap:
# the workout library ships `defaultHidden` in brands/symply-health/brand.cjs, so
# it lives in the More hub's "MORE TABS" section until the user pins it. Routing
# through the hub is the point — an unpinned tab that cannot be reached is a lost
# feature.
#
# Workouts is the LAST entry in the brand pack's tab pool, so its overflow row is
# the LAST one in the hub — probe DOWN first, then UP in case a preceding flow
# left the list below it. The tap itself is the hard proof, not the scroll.
- runFlow: go-more.yaml
- scrollUntilVisible:
    element:
      id: 'more-tab-health-exercises'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- scrollUntilVisible:
    element:
      id: 'more-tab-health-exercises'
    direction: UP
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- tapOn:
    id: 'more-tab-health-exercises'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'health-exercises-screen'
    timeout: 30000
