appId: com.symply.health
tags:
  - util
  - app:health
---
# Switch to the Fridge tab (route health-fridge, label Fridge, header "Fridge").
#
# Unlike Nutrition / Activity / Trends there is NO `tab-health-fridge` to tap:
# Fridge ships `defaultHidden` in brands/symply-health/brand.cjs, so it lives in
# the More hub's "MORE TABS" section until the user pins it. Routing through the
# hub is the point — an unpinned tab that cannot be reached is a lost feature.
- runFlow: go-more.yaml
# Fridge is the SEVENTH overflow row — always below the fold on a phone — so the
# DOWN probe is the one that normally does the work. Both directions are probed
# anyway because a preceding flow may have left the hub scrolled past it.
- scrollUntilVisible:
    element:
      id: 'more-tab-health-fridge'
    direction: UP
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- scrollUntilVisible:
    element:
      id: 'more-tab-health-fridge'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- tapOn:
    id: 'more-tab-health-fridge'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'health-fridge-screen'
    timeout: 30000
