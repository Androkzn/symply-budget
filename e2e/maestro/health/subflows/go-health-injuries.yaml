appId: com.symply.health
tags:
  - util
  - app:health
---
# Switch to the Injuries tab (route health-injuries, label Injuries, header "Injuries").
#
# Like Fridge there is NO `tab-health-injuries` to tap: Injuries ships
# `defaultHidden` in brands/symply-health/brand.cjs, so it lives in the More
# hub's "MORE TABS" section until the user pins it. Routing through the hub is
# the point — an unpinned tab that cannot be reached is a lost feature.
- runFlow: go-more.yaml
# Injuries is the LAST overflow row (it follows Workouts in the brand pack), so
# it is always below the fold on a phone and the DOWN probe does the work. Both
# directions are probed anyway because a preceding flow may have left the hub
# scrolled past it.
- scrollUntilVisible:
    element:
      id: 'more-tab-health-injuries'
    direction: UP
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- scrollUntilVisible:
    element:
      id: 'more-tab-health-injuries'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- tapOn:
    id: 'more-tab-health-injuries'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'health-injuries-screen'
    timeout: 30000
