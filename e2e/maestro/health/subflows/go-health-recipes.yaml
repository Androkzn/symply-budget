appId: com.symply.health
tags:
  - util
  - app:health
---
# Switch to the Recipes tab (route health-recipes, label Recipes, header
# "Recipes").
#
# Unlike Nutrition / Activity / Trends there is NO `tab-health-recipes` to tap:
# Recipes ships `defaultHidden` in brands/symply-health/brand.cjs, so it lives in
# the More hub's "MORE TABS" section until the user pins it. Routing through the
# hub is the point — an unpinned tab that cannot be reached is a lost feature.
- runFlow: go-more.yaml
# Recipes is the SIXTH overflow row, so it is the likeliest of them to start
# below the fold. Probe both directions; the tap is the hard proof, not the
# scroll.
- scrollUntilVisible:
    element:
      id: 'more-tab-health-recipes'
    direction: UP
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- scrollUntilVisible:
    element:
      id: 'more-tab-health-recipes'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- tapOn:
    id: 'more-tab-health-recipes'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'health-recipes-screen'
    timeout: 30000
