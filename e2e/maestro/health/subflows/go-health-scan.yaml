appId: com.symply.health
tags:
  - util
  - app:health
---
# Switch to the Scan tab (route health-scan, label Scan, header "Scan").
#
# Scan ships `defaultHidden` in brands/symply-health/brand.cjs — AI is opt-in for
# this app — so it lives in the More hub's "MORE TABS" section. It is the LAST
# entry in the pool, so it is always below the fold on a phone and the DOWN probe
# does the work.
- runFlow: go-more.yaml
- scrollUntilVisible:
    element:
      id: 'more-tab-health-scan'
    direction: UP
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- scrollUntilVisible:
    element:
      id: 'more-tab-health-scan'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 10
    optional: true
- tapOn:
    id: 'more-tab-health-scan'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'health-scan-screen'
    timeout: 30000
