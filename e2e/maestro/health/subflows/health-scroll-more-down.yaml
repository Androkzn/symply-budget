appId: com.symply.health
tags:
  - util
  - app:health
---
# Swipe the Health More ScrollView toward the bottom.
- repeat:
    times: 5
    commands:
      - swipe:
          start: '50%,75%'
          end: '50%,25%'
          duration: 320
          optional: true
      - waitForAnimationToEnd:
          timeout: 250
