            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-vitality-mood-6'
      - extendedWaitUntil:
          visible:
            id: 'health-vitality-mood-value'
            text: '6/10'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /mens-health/entries
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-vitality-sleep-9'
      - extendedWaitUntil:
          visible:
            id: 'health-vitality-sleep-value'
            text: '9/10'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /mens-health/entries
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-vitality-sleep-5'
      - extendedWaitUntil:
          visible:
            id: 'health-vitality-sleep-value'
            text: '5/10'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /mens-health/entries
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-vitality-stress-2'
      - extendedWaitUntil:
          visible:
            id: 'health-vitality-stress-value'
            text: '2/10'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /mens-health/entries
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-vitality-stress-5'
      - extendedWaitUntil:
          visible:
            id: 'health-vitality-stress-value'
            text: '5/10'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /mens-health/entries
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000

      # --- The taps reached the MODEL, not just the label (VITALITY-130) -
      # energy 4 -> 4 * 10 = 40; clarity 8, mood 6, stress 5 -> 8*5 + 6*5 - 0
      # = 70. The tiles carry a merged accessibility label, so they are matched
      # on the whole string `Energy: 40`, not on a substring.
      - runFlow:
          file: subflows/health-swipe-section-to.yaml
          env:
            TARGET_ID: 'health-vitality-sub-energy'
            SCROLL_DIR: up
      - assertVisible:
          id: 'health-vitality-sub-energy'
          text: 'Energy: 40'
      - assertVisible:
          id: 'health-vitality-sub-mental'
          text: 'Mental: 70'

      # --- …and they track a SECOND state (HEALTH-VITALITY-131) ----------
      # energy 7 -> 70; stress 10 -> 8*5 + 6*5 - 15 = 55. Two states rule out a
      # tile that happens to agree with the formula once by coincidence.
      - runFlow:
          file: subflows/health-swipe-section-to.yaml
          env:
            TARGET_ID: 'health-vitality-energy-7'
            SCROLL_DIR: down
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-vitality-energy-7'
      - extendedWaitUntil:
          visible:
            id: 'health-vitality-energy-value'
            text: '7/10'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /mens-health/entries
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-vitality-stress-10'
      - extendedWaitUntil:
          visible:
            id: 'health-vitality-stress-value'
            text: '10/10'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /mens-health/entries
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - runFlow:
          file: subflows/health-swipe-section-to.yaml
          env:
            TARGET_ID: 'health-vitality-sub-energy'
            SCROLL_DIR: up
      - assertVisible:
          id: 'health-vitality-sub-energy'
          text: 'Energy: 70'
      - assertVisible:
          id: 'health-vitality-sub-mental'
          text: 'Mental: 55'

      # =================================================================
      # KEGELS — the boundary the sibling flow does not reach
      # =================================================================
      # --- A figure above the ceiling is CLAMPED, not rejected (132) -----
      # `clampKegelSets` caps at 50. The field must read back the clamped value,
      # i.e. the stored number re-rendered — not the raw draft the user typed.
      # `handleKegels` → `persist` → same PUT /health/mens-health/entries, 200
      # write path as every scale/toggle above (also fires on the keypad-dismiss
      # blur — `onBlur={handleKegels}` — hence clearing before the dismiss).
      - runFlow:
          file: subflows/health-swipe-section-to.yaml
          env:
            TARGET_ID: 'health-vitality-kegel-input'
            SCROLL_DIR: down
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-vitality-kegel-input'
      - eraseText
      - inputText: '99'
      # NOT `hideKeyboard` — it hard-fails on this build's number pad.
      - runFlow:
          file: subflows/dismiss-health-keypad.yaml
          env:
            KEYPAD_ANCHOR: 'KEGELS'
      - tapOn:
          id: 'health-vitality-kegel-save'
      - extendedWaitUntil:
          visible:
            id: 'health-vitality-kegel-input'
            text: '50'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /mens-health/entries
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000

      # --- An emptied field means zero, not "leave it alone" (VITALITY-133)
      # This is also the teardown for the control: `clampKegelSets(NaN)` is 0,
      # and 0 renders as the placeholder rather than a literal `0`.
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-vitality-kegel-input'
      - eraseText
      - runFlow:
          file: subflows/dismiss-health-keypad.yaml
          env:
            KEYPAD_ANCHOR: 'KEGELS'
      - tapOn:
          id: 'health-vitality-kegel-save'
      - extendedWaitUntil:
          notVisible:
            id: 'health-vitality-kegel-input'
            text: '50'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /mens-health/entries
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      # Not merely "no longer 50" — a field left holding any digit would pass
      # that. The clamped-to-zero state renders the placeholder, i.e. no digits.
      - assertNotVisible:
          id: 'health-vitality-kegel-input'
          text: '.*[0-9].*'

      # =================================================================
      # Teardown — every toggle back off (HEALTH-VITALITY-134)
      # =================================================================
      # `vitality-log-and-score.yaml` OPENS by asserting both conditional rows
      # are absent, so leaving either gate on would fail the sibling flow rather
      # than this one — the worst kind of residue.
      - runFlow:
          file: subflows/health-swipe-section-to.yaml
          env:
            TARGET_ID: 'health-vitality-morning'
            SCROLL_DIR: up
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-vitality-morning'
      - extendedWaitUntil:
          notVisible:
            id: 'health-vitality-morning-quality'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /mens-health/entries
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - assertVisible:
          id: 'health-vitality-morning'
          checked: false
      - runFlow:
          file: subflows/health-swipe-section-to.yaml
          env:
            TARGET_ID: 'health-vitality-solo'
            SCROLL_DIR: up
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-vitality-solo'
      - extendedWaitUntil:
          notVisible:
            id: 'health-vitality-satisfaction'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /mens-health/entries
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - assertVisible:
          id: 'health-vitality-solo'
          checked: false

      # --- Back to the Health tab ----------------------------------------
      - tapOn:
          id: 'tab-index'
      - extendedWaitUntil:
          visible:
            id: 'health-home-screen'
          timeout: 30000
- runFlow:
    file: ../subflows/e2e-matrix-after.yaml
