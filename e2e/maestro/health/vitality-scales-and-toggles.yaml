# Matrix: HEALTH-VITALITY-120 … HEALTH-VITALITY-134
---
# Vitality tab — EVERY scale row and EVERY toggle on the screen, driven.
#
# WHY THIS FLOW EXISTS. `vitality-log-and-score.yaml` owns the screen's shape:
# it opens the tab, pins the score card's two-branch invariant, the four
# sub-score tiles, the two conditional rows and the kegel round trip. What it
# does NOT do is drive the controls — of the eighteen interactive elements on
# `HealthVitalityScreen` it touched five, and the ten `HealthScaleRow`s were
# asserted but never tapped. That was the largest single control gap in the app
# (5/18). This flow closes it.
#
# Splitting rather than extending, for the reason the two nutrition flows were
# split: one flow covering both halves would be long enough that a mid-run
# XCUITest driver drop would cost the whole surface.
#
# ## What "driving a control" means here
#
# A scale row set to ONE value cannot tell a working control from a hard-coded
# default, so every scale is driven to at least TWO different levels and one is
# driven to both ENDS of its range (1 and 10). Every toggle is flipped ON and
# then OFF again — a toggle driven one way would pass even if `onChange` had
# been made idempotent-on.
#
# ## The strongest assertion in this flow is the DERIVED one
#
# Two of the donor's four sub-scores are pure functions of controls on this
# screen and of nothing else:
#
#     energyScore = energyLevel * 10
#     mentalScore = mentalClarity * 5 + mood * 5 - (stressLevel - 5) * 3
#
# so after setting energy / clarity / mood / stress this flow can predict the
# tiles exactly. Asserting `Energy: 40` and then `Energy: 70` proves the segment
# tap reached the MODEL, not merely the row's own `n/10` label — a regression
# that repainted the track without persisting would pass a label-only test.
# `sexualHealthScore` and `erectionScore` are deliberately NOT asserted on an
# absolute value: both subtract for the ISSUE toggles, which live on a shared
# account this flow does not own.
#
# The two derived assertions each cost a scroll to the top of the screen and
# back, so they are batched: one trip proves Energy AND Mental together.
#
# ## Scrolling
#
# `subflows/health-swipe-section-to.yaml`, never a bare `scrollUntilVisible`:
# measured on 2026-07-26, `scrollUntilVisible` moves a Health section list ZERO
# pixels on a long hop and this screen is eight cards tall. See that subflow's
# header for the reproduction.
#
# ## Keyboard
#
# `health-vitality-kegel-input` is `keyboardType="number-pad"`. Maestro's
# `hideKeyboard` HARD-FAILS on this build's numeric keyboards, so the keypad is
# dismissed with `subflows/dismiss-health-keypad.yaml`.
#
# ## RE-RUNNABILITY
#
# There is no "delete today's entry" affordance — the screen upserts one row per
# day — so teardown is about the controls whose state INVERTS on a second run:
#
#   * every toggle this flow flips is flipped back, and the two conditional rows
#     are asserted GONE again, because `vitality-log-and-score.yaml` opens by
#     asserting both are absent;
#   * the kegel field is returned to empty;
#   * libido and energy are left on 8 and 7 — the values the sibling flow set
#     and asserts — so the two flows are order-independent within a run;
#   * the remaining scales keep their last level. A scale has no "unset" and
#     re-tapping the same segment is idempotent, so that is not residue. This is
#     the same contract the matrix records for Cycle's mood/energy.
- runFlow: subflows/health-ensure-session.yaml
- runFlow:
    file: ../subflows/e2e-matrix-before.yaml
    env:
      E2E_APP_SCHEME: simplehealth
      E2E_MATRIX_ROW: HEALTH-VITALITY-120
- runFlow:
    when:
      visible:
        id: 'health-home-screen'
    commands:
      # --- The tab opens from the More hub (HEALTH-VITALITY-120) ----------
      - runFlow: subflows/go-health-vitality.yaml
      - assertVisible: "Men's Health"
      - assertVisible:
          id: 'health-vitality-screen'

      # =================================================================
      # DRIVE
      # =================================================================
      # --- Libido crosses all three hint bands (HEALTH-VITALITY-121) -----
      # `libidoDescription` has three bands (<5, 5–7, >=8). Driving one value
      # cannot tell a live hint from a constant, so the row is walked across all
      # three, upward, and left on 8 — the level the sibling flow asserts.
      # Every scale/toggle tap below is its own `HealthScaleRow`/`HealthToggleRow
      # onChange` → `persist` (HealthVitalityScreen.tsx) → `saveVitalityEntry`
      # (healthVitalityStorage.ts) → `healthApi.saveMensHealth` → PUT
      # /health/mens-health/entries, 200 — the same write path
      # `vitality-log-and-score.yaml` verifies. Each tap gets its OWN
      # clear-log/verify pair (rather than one clear-log per group) because the
      # method+path+status spec cannot distinguish one value from the next — only
      # a fresh ring buffer since the immediately preceding tap proves THIS tap
      # fired its own request rather than reusing a stale match.
      - runFlow:
          file: subflows/health-swipe-section-to.yaml
          env:
            TARGET_ID: 'health-vitality-libido-3'
            SCROLL_DIR: down
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-vitality-libido-3'
      - extendedWaitUntil:
          visible:
            id: 'health-vitality-libido-value'
            text: '3/10'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /mens-health/entries
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - assertVisible: 'Below average'
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-vitality-libido-6'
      - extendedWaitUntil:
          visible:
            id: 'health-vitality-libido-value'
            text: '6/10'
          timeout: 10000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /mens-health/entries
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - assertVisible: 'Normal range'
      - runFlow:
