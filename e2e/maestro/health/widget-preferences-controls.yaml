# Matrix: HEALTH-WIDGETSET-101 … 116 (101-111 original; 112-116 added with the
# donor-parity widget port / migration 0144 — small_widget_style +
# medium_widget_layout/medium_primary_metric/medium_secondary_metric/
# medium_show_all_metrics. HealthWidgetSettingsScreen had ZERO E2E before this
# flow; see backend coverage at HEALTH-ASSET-007/009/021/024/028/029)
---
# Widget settings — all ELEVEN `widget_preferences` columns, on a device.
#
# WHY THIS FLOW EXISTS
# ---------------------
# `GET`/`PUT /health/widget/preferences` have been deployed since parity P2
# with no caller at all — `HealthWidgetSettingsScreen` is the screen that
# finally owns them, and until this flow it had never been driven on a
# simulator. Every field here is a real PUT to the shared fleet account, so
# what this flow proves that a Jest render test cannot: the value SURVIVES a
# navigate-away-and-back (i.e. it was actually written, not just painted), and
# the summary card + the More hub row subtitle both re-derive from what is
# actually stored rather than from local component state.
#
# GOTCHA — NATIVE SWITCH HIT-TESTING
# -----------------------------------
# The three `show_*` rows are a real RN `Switch` (native `UISwitch`), not a
# `Pressable`. A plain `tapOn` on a freshly-mounted UISwitch under `idb ui tap`
# was observed to silently drop the first touch during manual verification of
# this screen; Maestro's XCUITest-backed `tapOn` does not share that failure
# mode; `retryTapIfNoChange: true` is kept anyway as a defence.
#
# STATE / TEARDOWN
# -----------------
# `widget_preferences` is ACCOUNT-level (one row per user, upserted — see
# HEALTH-ASSET-009), shared with every other flow and device signed into the
# shared fleet account. This flow always ends on `DEFAULT_HEALTH_WIDGET_PREFERENCES`
# (steps / bar / weight / all three show_* on / standard small style / standard
# medium layout / steps+calories medium metrics / show-all on) — the exact
# shape HEALTH-ASSET-021 asserts an unsaved account reads — so a run that dies
# mid-flow is the only way to leave this dirty, and every leg restores its own
# control before moving to the next.
#
# NETWORK VERIFICATION
# ---------------------
# Every control on this screen is real: `onValueChange`/`onSelect` ->
# `patch()` -> `saveWidgetPreferences()` (healthWidgetStorage.ts) ->
# `healthAssetsApi.saveWidgetPreferences` (src/api/healthAssets.ts, BASE
# '/health') -> `PUT /health/widget/preferences` (200) at
# backend/src/routes/health-assets.ts. There is no local-only control on this
# screen to flag. `patch()` also updates `prefs` OPTIMISTICALLY before
# awaiting the PUT (setPrefs runs before `await saveWidgetPreferences`), so a
# `tapOn` immediately followed only by `assertVisible` (no pre-existing
# `extendedWaitUntil`) does not itself prove the write landed — those legs get
# a short `waitForAnimationToEnd` before the network check below instead of
# reusing a UI wait.
- runFlow: subflows/health-ensure-session.yaml
- runFlow:
    file: ../subflows/e2e-matrix-before.yaml
    env:
      E2E_APP_SCHEME: simplehealth
      E2E_MATRIX_ROW: HEALTH-WIDGETSET-101
- runFlow:
    when:
      visible:
        id: 'health-home-screen'
    commands:
      # GUARD — CONCURRENT-SESSION FAST REFRESH (2026-08-02): this flow was
      # failing at `tapOn: id: tab-settings` inside `go-more.yaml` (reached
      # via `go-health-widget.yaml` below) with "Element not found: Id
      # matching regex: tab-settings" — NOT a stale/wrong testID (`tab-
      # settings` is the correct, current id; it's used successfully by many
      # other flows in this same run, e.g. more-brand-isolation.yaml) and NOT
      # the same issue as the shipped-defaults `show_weight` assertion below
      # (that one was already investigated separately and left unchanged).
      # The live report's failure screenshot (widget-preferences-controls
      # step 190) shows a blue "Refreshing..." banner (React Native's
      # DevLoadingView, painted only when Metro Fast-Refreshes this connected
      # simulator because a watched file changed on disk) stacked over a red
      # "No internet connection" banner — a concurrent session in this repo
      # is bumping `brands/symply-health/brand.cjs`'s build number and
      # regenerating token/icon files mid-suite, which Metro treats as a
      # source change; the resulting remount tears down and rebuilds the tab
      # bar (and drops in-flight requests, hence the ERR-tagged network calls
      # one step earlier at the "Done" keyboard-dismiss tap). `tab-settings`
      # briefly doesn't exist mid-remount, so the ~9.5s tap-retry window
      # timed out. Same signature already root-caused in
      # `activity-goals-and-session-edit.yaml` / `water-tab-goal-units-
      # custom.yaml` / `weight-tab-goal-start-field.yaml` — gate on the
      # banner clearing rather than guessing at a bigger timeout. This waits
      # here, in THIS flow, rather than inside `go-more.yaml` /
      # `go-health-widget.yaml`, because those subflows are shared by every
      # flow in the fleet (Health + Kaizen + Language + Budget all have their
      # own `go-more.yaml`/equivalent) and are out of scope for this fix.
      - extendedWaitUntil:
          notVisible: 'Refreshing...'
          timeout: 20000
      - runFlow: subflows/go-health-widget.yaml

      # --- HEALTH-WIDGETSET-101: shipped defaults on first read -------------
      - assertVisible: 'Your widget shows'
      - assertVisible:
          id: 'health-widget-summary-line'
          text: 'Steps, plus weight, nutrition, workouts'
      - assertVisible: 'SMALL WIDGET'
      - assertVisible:
          id: 'health-widget-metric-steps'
      - assertVisible:
          id: 'health-widget-show-weight'
      # The CHART card now sits below the MEDIUM WIDGET card (migration 0144:
      # layout/primary/secondary/show-all) and the show-weight/nutrition/
      # workouts card, both added after this assertion was first written —
      # reproduced 2026-08-01, chart-type-bar is off-screen on load without a
      # scroll.
      - scrollUntilVisible:
          element:
            id: 'health-widget-chart-type-bar'
          direction: DOWN
          timeout: 15000
          visibilityPercentage: 10
      - assertVisible:
          id: 'health-widget-chart-type-bar'
      - assertVisible:
