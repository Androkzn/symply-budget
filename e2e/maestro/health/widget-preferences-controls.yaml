            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      # Restore both to their shipped defaults NOW, while "dual" still shows
      # their controls — teardown can't reach them once the layout changes.
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-widget-medium-primary-steps'
          retryTapIfNoChange: true
      - waitForAnimationToEnd:
          timeout: 1500
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /health/widget/preferences
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-widget-medium-secondary-calories'
          retryTapIfNoChange: true
      - waitForAnimationToEnd:
          timeout: 1500
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /health/widget/preferences
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - assertVisible:
          id: 'health-widget-medium-primary-steps'
      - assertVisible:
          id: 'health-widget-medium-secondary-calories'

      # --- HEALTH-WIDGETSET-115: grid layout has neither control set ---------
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-widget-medium-layout-grid'
          retryTapIfNoChange: true
      - assertVisible:
          id: 'health-widget-medium-layout-grid'
      - extendedWaitUntil:
          notVisible:
            id: 'health-widget-medium-show-all'
          timeout: 20000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /health/widget/preferences
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - assertNotVisible:
          id: 'health-widget-medium-primary-water'

      # --- HEALTH-WIDGETSET-116: restore Medium defaults before the rest ------
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-widget-medium-layout-standard'
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            id: 'health-widget-medium-show-all'
          timeout: 20000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /health/widget/preferences
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000

      # --- HEALTH-WIDGETSET-108: the privacy card names the limit -----------
      - assertVisible:
          id: 'health-widget-privacy'
      - assertVisible: 'Photos, cycle records and vitality records are never sent to it.'

      # --- HEALTH-WIDGETSET-109: a choice SURVIVES leaving the screen -------
      # Set a non-default value, leave via the back button, come back, and
      # confirm it was actually written rather than only painted.
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-widget-metric-calories'
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            id: 'health-widget-summary-line'
            text: 'Calories, plus weight, nutrition, workouts'
          timeout: 20000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /health/widget/preferences
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - tapOn:
          id: 'health-widget-screen-back'
      - extendedWaitUntil:
          visible:
            id: 'health-more-screen'
          timeout: 30000
      # --- HEALTH-WIDGETSET-110: the More hub row re-derives from storage ---
      - scrollUntilVisible:
          element:
            id: 'health-setting-widget'
          direction: DOWN
          timeout: 20000
          visibilityPercentage: 10
          optional: true
      - assertVisible: 'Calories, plus weight, nutrition, workouts'
      - runFlow: subflows/go-health-widget.yaml
      - assertVisible:
          id: 'health-widget-summary-line'
          text: 'Calories, plus weight, nutrition, workouts'

      # --- HEALTH-WIDGETSET-111 + TEARDOWN: restore the shipped defaults ----
      - runFlow:
          file: ../subflows/e2e-clear-log.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
      - tapOn:
          id: 'health-widget-metric-steps'
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            id: 'health-widget-summary-line'
            text: 'Steps, plus weight, nutrition, workouts'
          timeout: 20000
      - runFlow:
          file: ../subflows/e2e-verify-network.yaml
          env:
            E2E_APP_SCHEME: simplehealth
            APP_ID: com.symply.health
            E2E_VERIFY_METHOD: PUT
            E2E_VERIFY_PATH: /health/widget/preferences
            E2E_VERIFY_STATUS: '200'
      - extendedWaitUntil:
          visible:
            id: 'e2e-verify-badge'
            text: '^PASS'
          timeout: 5000
      - assertVisible:
          id: 'health-widget-chart-type-bar'
      - assertVisible:
          id: 'health-widget-chart-metric-weight'
      # Small style + Medium layout were already restored to their defaults in
      # HEALTH-WIDGETSET-112/113/116 above (no further control changes since).
      - assertVisible:
          id: 'health-widget-small-style-standard'
      - assertVisible:
          id: 'health-widget-medium-layout-standard'
      - assertVisible:
          id: 'health-widget-medium-show-all'

      # --- Back to the Health tab --------------------------------------------
      - tapOn:
          id: 'health-widget-screen-back'
      - extendedWaitUntil:
          visible:
            id: 'health-more-screen'
          timeout: 30000
      - tapOn:
          id: 'tab-index'
      - extendedWaitUntil:
          visible:
            id: 'health-home-screen'
          timeout: 30000
- runFlow:
    file: ../subflows/e2e-matrix-after.yaml
