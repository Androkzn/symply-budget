appId: com.symply.house
tags:
  - app:house
  - feature:home-projects
  - regression
# Matrix: HOUSE-HPROJ-MAT-002 (material row → editor: references, save, delete)
#
# The material screen after it became the EDITOR rather than a read view with an
# edit button. Four things this pins, each of which was a separate decision:
#
#   1. the row opens it — there is no "Edit" affordance to find any more
#   2. References sit at the top, above the product shot
#   3. Save exists only while there is something to save
#   4. Delete is in the header, not on the row a member scrolls past
#
# Deliberately does NOT delete anything. The delete button is asserted present
# and left alone: this flow shares a household with every other House suite, and
# a flow that removes the material the surface-budget flow attaches would break
# it in a way that looks like a bug in the studio.
---
- runFlow: ../subflows/launch-logged-in.yaml
- runFlow: ../subflows/open-home-project-hub.yaml

# ---- a material to open --------------------------------------------------
- repeat:
    times: 4
    while:
      notVisible:
        id: 'materials-add-fab'
    commands:
      - tapOn:
          id: 'hub-tab-materials'
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'materials-add-fab'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
# Regex for the reason `home-projects-surface-budget.yaml` documents at length:
# the row is an accessible container, so the tree holds one merged
# `accessibilityText` and never the bare name.
- runFlow:
    when:
      notVisible: '.*E2E Surface Tile.*'
    commands:
      - tapOn:
          id: 'materials-add-fab'
      - extendedWaitUntil:
          visible:
            id: 'materials-add-menu'
          timeout: 10000
      - tapOn:
          id: 'materials-add-manual'
      - extendedWaitUntil:
          visible:
            id: 'materials-manual-sheet'
          timeout: 10000
      - tapOn:
          id: 'add-selection-input'
      - inputText: 'E2E Surface Tile'
      - tapOn:
          id: 'materials-manual-save'
- extendedWaitUntil:
    visible: '.*E2E Surface Tile.*'
    timeout: 15000

# ---- (1) the row IS the way in -------------------------------------------
# No `selection-edit-*` and no `selection-remove-*` anywhere on the row: the
# card itself opens the editor, and delete moved into that screen's header.
- assertNotVisible:
    id: 'selection-edit-.*'
- assertNotVisible:
    id: 'selection-remove-.*'
- tapOn: '.*E2E Surface Tile.*'
- extendedWaitUntil:
    visible:
      id: 'material-detail-screen'
    timeout: 20000

# ---- (2) references, at the top ------------------------------------------
# Asserted before any scrolling, which is what makes this a claim about
# POSITION and not merely about existence.
- assertVisible:
    id: 'material-detail-references'
- assertVisible:
    id: 'material-detail-reference-add'

# ---- (3) delete in the header, (4) no Save until there is an edit ---------
- assertVisible:
    id: 'material-detail-delete'
- assertNotVisible:
    id: 'material-detail-save'
# Notes is the last field in a long form, so it is scrolled to. It is also the
# deliberately HARMLESS one to dirty: renaming the material would break the
# `.*E2E Surface Tile.*` match that `home-projects-surface-budget.yaml` and the
# guard above both depend on, in a household every House suite shares.
- scrollUntilVisible:
    element:
      id: 'material-detail-notes'
    direction: DOWN
    timeout: 20000
    # Centre it: the floating tab bar covers the bottom of the viewport and
    # Maestro measures visibility against the screen, not against what
    # overlays it, so a "visible" CTA down there can still take the tap on
    # the tab bar and switch tabs instead.
    centerElement: true
- tapOn:
    id: 'material-detail-notes'
- inputText: 'e2e'
# `optional: true` only — NO neutral-point tap. The tap was added on a wrong
# premise (assumed iPad keyboard chrome) and was UNSAFE: 50%,12% is (417,145)
# on an 834x1210 iPad, which lands on real controls — the profile avatar
# (opens a camera Alert), the contractor photo circle (ActionSheet), a bare
# TextInput on property-assessment. On iPhone 12% is inside the 118pt header,
# outside the ScrollView, so it dismisses nothing at all. An `optional`
# hideKeyboard cannot abort the flow, which is all that was ever needed here.
- hideKeyboard:
    optional: true
- extendedWaitUntil:
    visible:
      id: 'material-detail-save'
    timeout: 10000
- tapOn:
    id: 'material-detail-save'
# A successful save CLOSES the screen — `useUnsavedChanges` calls `onClose` on
# success and here that is `navigation.goBack()`. So the hub coming back is the
# proof the save took; asserting the Save button had gone would pass for the
# wrong reason, since everything on the screen goes with it.
- extendedWaitUntil:
    visible:
      id: 'home-project-hub-title'
    timeout: 20000
- assertNotVisible:
    id: 'material-detail-screen'
