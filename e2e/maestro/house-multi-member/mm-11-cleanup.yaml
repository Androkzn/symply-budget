appId: com.symply.house
tags:
  - app:house
  - feature:local-first
  - feature:multi-member
  - mutation
# Matrix: HOUSE-MM-011 — remove any task this run created that is still around,
# so a re-run starts from the same state (the ledger persists across runs on
# both simulators).
#
# Matched by ANCHOR, not by full title: phases 3 and 4 rename the row, so by the
# time cleanup runs the title carries whichever token won the merge. The anchor
# (`MM Owner <ts>` / `MM Member <ts>`) is the part that never changes.
#
# Everything here is best-effort. Rows are timestamped per run, so a leftover
# never collides with the next attempt — failing the suite during teardown would
# only hide the result of the phases that matter.
#
# env: MM_ANCHOR
---
- runFlow: mm-network-block-off.yaml
- runFlow: mm-dismiss-dev-chrome.yaml
- runFlow: mm-dismiss-stale-alerts.yaml
- runFlow: mm-go-tasks.yaml
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible: '.*${MM_ANCHOR}.*'
          commands:
            - tapOn:
                text: '.*${MM_ANCHOR}.*'
                optional: true
            - extendedWaitUntil:
                visible:
                  id: 'task-detail-screen'
                timeout: 15000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: 'task-detail-screen'
                commands:
                  - scrollUntilVisible:
                      element:
                        id: 'task-detail-delete'
                      direction: DOWN
                      centerElement: true
                      timeout: 10000
                      optional: true
                  - tapOn:
                      id: 'task-detail-delete'
                      optional: true
                  - extendedWaitUntil:
                      visible: '.*Are you sure you want to delete this task.*'
                      timeout: 10000
                      optional: true
                  - tapOn:
                      text: '^Delete$'
                      optional: true
                  - waitForAnimationToEnd:
                      timeout: 3000
                  - tapOn:
                      id: 'task-detail-close'
                      optional: true
            - runFlow: mm-go-tasks.yaml
- runFlow: mm-sync-pulse.yaml
