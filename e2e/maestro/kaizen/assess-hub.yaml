appId: com.symply.kaizen
---
# Assess hub (overflow route): mastery summary loads.
# (Scroll contract removed — see today-screen.yaml for the Maestro/iOS-26 scroll note.)
- runFlow: subflows/launch-kaizen.yaml
- openLink: kaizen:///kaizen-assess
- extendedWaitUntil:
    visible:
      id: 'kaizen-assess-screen'
    timeout: 20000
- assertVisible: 'Assess'
- assertVisible: 'SKILL MASTERY'
