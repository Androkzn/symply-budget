appId: com.symply.kaizen
---
# Books — library, optional PDF upload, add-book form + language pill.
- runFlow: subflows/launch-kaizen.yaml
- runFlow:
    file: subflows/open-kaizen-route.yaml
    env:
      KAIZEN_ROUTE: kaizen:///kaizen/books
- extendedWaitUntil:
    visible: 'Books'
    timeout: 20000
- runFlow: subflows/scroll-kaizen-to-top.yaml
- assertVisible: 'Your library'
- assertVisible: 'Upload book PDF'
- assertVisible: 'Library'
- runFlow:
    file: subflows/pick-kaizen-fixture.yaml
    env:
      KAIZEN_ROUTE: kaizen:///kaizen/books
      E2E_PICK_KEY: 'kaizen-book'
      E2E_PICK_NAME: 'book.pdf'
      E2E_PICK_REGEX: 'book\\.pdf'
- extendedWaitUntil:
    visible:
      id: kaizen-upload-selected-file
    timeout: 60000
- assertVisible: 'book.pdf'
- tapOn: 'Add a book'
- assertVisible: 'NEW BOOK'
- tapOn: 'Book title'
- inputText: 'Atomic Habits'
- assertVisible: 'Atomic Habits'
- scrollUntilVisible:
    element:
      text: 'Español'
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn: 'Español'
- tapOn: 'Cancel'
- runFlow:
    file: subflows/assert-kaizen-scroll-optional.yaml
    env:
      SCROLL_END_ID: kaizen-screen-scroll-end
- runFlow: subflows/return-to-today.yaml
