appId: com.symply.kaizen
tags:
  - app:kaizen
  - feature:sync
  - readonly
  - regression
  - smoke
# Matrix: KAIZEN-SYNC-014 — canonical stack routes (avoid bare kaizen://career links).
---
- runFlow: subflows/launch-kaizen.yaml
- openLink: kaizen://today
- extendedWaitUntil:
    visible:
      id: 'kaizen-today-screen'
    timeout: 30000
- openLink: kaizen:///kaizen-career
- extendedWaitUntil:
    visible:
      id: 'kaizen-career-screen'
    timeout: 20000
- openLink: kaizen:///kaizen-assess
- extendedWaitUntil:
    visible:
      id: 'kaizen-assess-screen'
    timeout: 20000
- openLink: kaizen:///kaizen-learn
- extendedWaitUntil:
    visible:
      id: 'kaizen-learn-screen'
    timeout: 20000
- openLink: kaizen:///kaizen/banks
- extendedWaitUntil:
    visible: 'Question banks'
    timeout: 20000
- openLink: kaizen:///kaizen/settings
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 20000
- runFlow: subflows/return-to-today.yaml
