appId: com.symply.kaizen
---
# Question banks — pick a bank, add a question, confirm the screen persists.
- runFlow: subflows/launch-kaizen.yaml
- runFlow:
    file: subflows/open-kaizen-route.yaml
    env:
      KAIZEN_ROUTE: kaizen:///kaizen/banks
- extendedWaitUntil:
    visible: 'Question banks'
    timeout: 20000
- runFlow: subflows/scroll-kaizen-to-top.yaml
- assertVisible: 'ADD QUESTION'
- scrollUntilVisible:
    element:
      id: kaizen-bank-behavioral
    direction: DOWN
    timeout: 20000
    speed: 70
    visibilityPercentage: 40
- tapOn:
    id: kaizen-bank-behavioral
- tapOn: 'Interview question'
- inputText: 'Tell me about a hard tradeoff you made'
- tapOn:
    id: 'kaizen-add-question'
    optional: true
- tapOn: 'Add question'
- assertVisible: 'Question banks'
- scrollUntilVisible:
    element:
      text: 'Import questions'
    direction: DOWN
    timeout: 20000
    speed: 70
    visibilityPercentage: 40
    optional: true
- assertVisible: 'Import questions'
- runFlow:
    file: subflows/assert-kaizen-scroll-optional.yaml
    env:
      SCROLL_END_ID: kaizen-screen-scroll-end
- runFlow: subflows/return-to-today.yaml
