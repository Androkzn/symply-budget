appId: com.symply.kaizen
tags:
  - util
  - app:kaizen
---
# Expo Dev Client chrome that blocks Maestro taps on Debug builds.
# Safe no-ops when already on the real Kaizen app surface.
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            visible: 'Login Failed'
          commands:
            - tapOn:
                text: 'OK'
                optional: true
            - tapOn:
                text: 'Cancel'
                optional: true
      - runFlow:
          when:
            visible: 'Open'
          commands:
            - tapOn: 'Open'
            - waitForAnimationToEnd:
                timeout: 2000
      - runFlow:
          when:
            visible: 'Continue'
          commands:
            - tapOn: 'Continue'
            - waitForAnimationToEnd:
                timeout: 2000
      - runFlow:
          when:
            visible: 'DEVELOPMENT SERVERS'
          commands:
            - tapOn:
                text: '.*:8081'
                optional: true
            - tapOn:
                text: '.*8081.*'
                optional: true
            - tapOn:
                text: 'http.*'
                optional: true
            - tapOn:
                point: '50%,38%'
                optional: true
            - waitForAnimationToEnd:
                timeout: 12000
      - runFlow:
          when:
            visible: 'Reload'
          commands:
            - tapOn:
                point: '92%,11%'
            - waitForAnimationToEnd:
                timeout: 2000
