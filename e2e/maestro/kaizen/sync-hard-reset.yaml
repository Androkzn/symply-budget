appId: com.symply.kaizen
tags:
  - destructive
  - app:kaizen
---
# SYNC-023 — uninstall/reinstall proxy: clearState + clearKeychain, then sign in fresh.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
      faceid: allow
- runFlow: subflows/kaizen-login-if-needed.yaml
- runFlow: subflows/kaizen-setup-if-needed.yaml
- runFlow: subflows/dismiss-welcome-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: 'kaizen-today-screen'
    timeout: 120000
- assertVisible: 'Today'
