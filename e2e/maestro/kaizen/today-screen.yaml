appId: com.symply.kaizen
---
# Today tab smoke: shell loads with the daily-core summary.
# NOTE: the scroll-contract step was removed — Maestro 2.6.1 cannot reliably
# scroll RN 0.86 (New Architecture) ScrollViews on iOS 26 (coordinate swipes are
# ignored; element-anchored swipes are non-deterministic). idb scrolls fine, so
# this is a Maestro/idb driver limitation, not an app bug. Track for a driver fix.
- runFlow: subflows/launch-kaizen.yaml
- assertVisible:
    id: 'kaizen-today-screen'
- assertVisible: 'Today'
- runFlow: subflows/assert-daily-core-visible.yaml
# Career-reps row (KAIZEN-TODAY-009) sits below the fold. Maestro 2.x cannot
# reliably scroll RN New-Arch ScrollViews on iOS 26, so try scroll-reveal first,
# then fall back to the banks deep link for the navigation assertion.
- scrollUntilVisible:
    element:
      id: 'kaizen-today-career-reps-open'
    direction: DOWN
    timeout: 12000
    optional: true
- runFlow:
    when:
      visible:
        id: 'kaizen-today-career-reps-open'
    commands:
      - tapOn:
          id: 'kaizen-today-career-reps-open'
      - extendedWaitUntil:
          visible: 'Question banks'
          timeout: 20000
      - runFlow: subflows/go-today.yaml
- runFlow:
    when:
      notVisible:
        id: 'kaizen-today-career-reps-open'
    commands:
      - openLink: kaizen://banks
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible: 'Question banks'
          timeout: 20000
          optional: true
      - runFlow: subflows/go-today.yaml
