appId: com.symply.house
tags:
  - app:house
  - feature:onboarding
  - readonly
  - regression
# Matrix: HOUSE-ONB-005
---
- runFlow: ../subflows/launch-onboarding.yaml
- runFlow: ../subflows/skip-onboarding-if-onboarded.yaml
- runFlow:
    when:
      visible:
        id: 'onboarding-get-started'
    commands:
      - tapOn:
          id: 'onboarding-agree-terms'
      - tapOn:
          id: 'onboarding-get-started'
      - extendedWaitUntil:
          visible:
            id: 'onboarding-create-home-submit'
          timeout: 30000
      - assertVisible:
          id: 'onboarding-create-home-name'
      - assertNotVisible:
          id: 'home-up-next-section'
