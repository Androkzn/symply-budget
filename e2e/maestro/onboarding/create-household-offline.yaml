appId: com.symply.house
tags:
  - app:house
  - feature:onboarding
  - regression
# Matrix: HOUSE-ONB-027
---
- runFlow: ../subflows/launch-onboarding.yaml
- runFlow: ../subflows/skip-onboarding-if-onboarded.yaml
- runFlow:
    when:
      visible:
        id: 'onboarding-get-started'
    commands:
      - runFlow: ../subflows/e2e-matrix-before.yaml
      - runFlow: ../subflows/launch-onboarding.yaml
      - toggleAirplaneMode
      - tapOn:
          id: 'onboarding-agree-terms'
      - tapOn:
          id: 'onboarding-get-started'
      - extendedWaitUntil:
          visible:
            id: 'onboarding-create-home-name'
          timeout: 30000
      - tapOn:
          id: 'onboarding-create-home-name'
      - inputText: 'E2E Offline Home'
      - hideKeyboard
      - tapOn:
          id: 'onboarding-create-home-submit'
      - extendedWaitUntil:
          visible:
            id: 'onboarding-create-home-name'
          timeout: 15000
      - toggleAirplaneMode
      - runFlow: ../subflows/e2e-matrix-after.yaml
