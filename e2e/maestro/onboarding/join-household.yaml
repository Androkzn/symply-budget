appId: com.symply.house
tags:
  - app:house
  - feature:onboarding
  - readonly
  - regression
# Matrix: HOUSE-onboarding (see documents/engineering/testing/matrices/)
---
- runFlow: ../subflows/launch-onboarding.yaml
- runFlow: ../subflows/skip-onboarding-if-onboarded.yaml
- runFlow:
    when:
      visible:
        id: 'onboarding-get-started'
    commands:
      # Only proceed if the join variant rendered (pending token present); otherwise skip.
      - runFlow:
          when:
            visible: 'Request to Join'
          commands:
            - assertVisible: 'Request to Join'
            - assertVisible: 'Skip — set up my own home'
            - tapOn: 'Request to Join'
            - extendedWaitUntil:
                visible: 'Continue'
                timeout: 30000
