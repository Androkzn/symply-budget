appId: com.symply.house
tags:
  - app:house
  - feature:onboarding
  - readonly
  - regression
# Matrix: HOUSE-onboarding (see documents/engineering/testing/matrices/)
---
- runFlow: ../subflows/launch-onboarding.yaml
- runFlow: ../subflows/skip-onboarding-if-onboarded.yaml
- runFlow:
    when:
      visible:
        id: 'onboarding-get-started'
    commands:
      - runFlow: ./create-household.yaml
      # (create-household leaves us on Create Home; a real run taps Create Home to arrive here.)
      - runFlow:
          when:
            visible: 'Skip for Now'
          commands:
            - assertVisible: 'Skip for Now'
            - tapOn: 'Skip for Now'
            - extendedWaitUntil:
                visible: 'Skip for Now'
                timeout: 30000
