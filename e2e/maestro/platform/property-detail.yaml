appId: com.symply.house
tags:
  - app:house
  - feature:households
  - readonly
  - regression
# Matrix: PLAT-HH-046
---
- runFlow: subflows/launch-platform.yaml
- runFlow: ../subflows/open-profile.yaml
- scrollUntilVisible:
    element:
      id: 'settings-row-household-members'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'settings-row-household-members'
- extendedWaitUntil:
    visible: 'My Properties'
    timeout: 20000
- tapOn:
    point: '50%,45%'
- extendedWaitUntil:
    visible:
      id: 'property-detail-screen'
    timeout: 20000
- assertVisible: 'Overview'
- assertVisible:
    id: 'property-detail-scroll'
