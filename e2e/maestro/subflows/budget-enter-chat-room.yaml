appId: com.symply.budget
tags:
  - util
  - app:budget
---
# Opens a chat room by name match or creates one via the New sheet.
# Env: ROOM_NAME (required). Does NOT reuse chat-rooms-first-room — parallel
# matrix runs accumulate rooms and the first row may have AI disabled, which
# breaks @assistant / mention-bar rows.
- extendedWaitUntil:
    visible:
      id: 'chat-rooms-screen'
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: 'chat-rooms-loading'
    timeout: 45000
    optional: true
# Budget's rooms list shows "No household selected" (NOT House's "No home
# selected") until the in-memory household store hydrates; while it shows there
# is no "+ New" button to tap. The screen now self-heals by fetching households
# on mount, so wait for that empty state to clear before creating a room.
- extendedWaitUntil:
    notVisible: 'No household selected'
    timeout: 90000
    optional: true
- runFlow:
    when:
      visible:
        id: 'chat-room-screen'
    commands: []
- runFlow:
    when:
      notVisible:
        id: 'chat-room-screen'
      visible:
        text: ${ROOM_NAME}
    commands:
      - tapOn:
          text: ${ROOM_NAME}
      - extendedWaitUntil:
          visible:
            id: 'chat-room-screen'
          timeout: 120000
- runFlow:
    when:
      notVisible:
        id: 'chat-room-screen'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'chat-rooms-new-button'
          timeout: 60000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: 'chat-rooms-new-button'
            visible:
              id: 'chat-rooms-empty-new-button'
          commands:
            - tapOn:
                id: 'chat-rooms-empty-new-button'
      - extendedWaitUntil:
          visible:
            id: 'chat-rooms-new-button'
          timeout: 30000
          optional: true
      # Android: the Expo dev-client's persistent floating tools button anchors
      # the same top-right corner as this header's own "+ New" action — the two
      # visually overlap (confirmed via screenshot), which can steal the tap or
      # trigger the dev menu instead of opening the New Conversation sheet.
      # Clear it defensively right before tapping, not just after.
      - runFlow: budget-dismiss-expo-dev-chrome.yaml
      - runFlow:
          when:
            visible:
              id: 'chat-rooms-new-button'
          commands:
            - tapOn:
                id: 'chat-rooms-new-button'
                retryTapIfNoChange: true
                optional: true
      - runFlow:
          when:
            notVisible:
              id: 'chat-rooms-new-button'
            visible:
              id: 'chat-rooms-empty-new-button'
          commands:
            - tapOn:
                id: 'chat-rooms-empty-new-button'
                retryTapIfNoChange: true
                optional: true
      # The rooms list refetches on focus, so the header New button can re-render
      # out from under the tap ("element not found" mid-transition). If the create
      # sheet hasn't opened yet, re-tap whichever New affordance is present.
      - runFlow:
          when:
            notVisible: 'New conversation'
          commands:
            - tapOn:
                id: 'chat-rooms-new-button'
                optional: true
                retryTapIfNoChange: true
            - tapOn:
                id: 'chat-rooms-empty-new-button'
                optional: true
                retryTapIfNoChange: true
      # Android: the Expo dev-client menu has been observed popping open right
      # around the New-button tap (cause not fully pinned down), covering the
      # "New conversation" sheet before the hard assert below. Clear it first
      # — this subflow is shared by every chat-room-creating flow in the suite.
      - runFlow: budget-dismiss-expo-dev-chrome.yaml
      - extendedWaitUntil:
          visible: 'New conversation'
          timeout: 15000
      - tapOn:
          id: 'chat-rooms-name-input'
          optional: true
      - inputText: ${ROOM_NAME}
      # The Create button sits behind the iOS keyboard in the sheet, so a direct
      # tap lands on a keyboard key (typing junk into the name) and the room is
      # never created. Submit via the return key instead — the single-line field's
      # onSubmitEditing creates the room and dismisses the keyboard. hideKeyboard
      # is unreliable on iOS New Arch (it WARNs and leaves the keyboard up).
      - pressKey: Enter
      - extendedWaitUntil:
          visible:
            id: 'chat-rooms-creating'
          timeout: 8000
          optional: true
      # Fallback: if return didn't submit-to-create, it still dismissed the
      # keyboard, so the Create button is now reachable. If the button is still
      # visible we're on the sheet (not navigated) — tap it directly.
      - runFlow:
          when:
            visible:
              id: 'chat-rooms-create-button'
          commands:
            - tapOn:
                id: 'chat-rooms-create-button'
                retryTapIfNoChange: true
      - extendedWaitUntil:
          notVisible:
            id: 'chat-rooms-creating'
          timeout: 120000
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          notVisible: 'New conversation'
          timeout: 30000
          optional: true
      # Room creation can hit a transient "Could not create room / Network Error"
      # (a MODAL native alert that blocks the sheet's Cancel/Create) on loaded
      # sims. Acknowledge the alert and re-submit via the return key — the Create
      # button sits behind the keyboard — a few times before giving up.
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  visible: 'Could not create room'
                commands:
                  - tapOn:
                      text: 'OK'
                      optional: true
                  - waitForAnimationToEnd:
                      timeout: 1500
                  - runFlow:
                      when:
                        visible: 'New conversation'
                      commands:
                        - tapOn:
                            id: 'chat-rooms-name-input'
                            optional: true
                        - pressKey: Enter
                        - extendedWaitUntil:
                            notVisible:
                              id: 'chat-rooms-creating'
                            timeout: 60000
                            optional: true
                        - waitForAnimationToEnd:
                            timeout: 3000
      - extendedWaitUntil:
          visible:
            id: 'chat-room-screen'
          timeout: 120000
      - runFlow:
          when:
            notVisible:
              id: 'chat-room-screen'
            visible:
              id: 'chat-rooms-create-error'
          commands:
            - tapOn:
                text: 'OK'
                optional: true
            - tapOn: 'Cancel'
            - extendedWaitUntil:
                visible:
                  id: 'chat-rooms-new-button'
                timeout: 30000
            - tapOn:
                id: 'chat-rooms-new-button'
            - extendedWaitUntil:
                visible: 'New conversation'
                timeout: 15000
            - inputText: ${ROOM_NAME}
            - tapOn:
                id: 'chat-rooms-create-button'
                retryTapIfNoChange: true
            - extendedWaitUntil:
                visible:
                  id: 'chat-room-screen'
                timeout: 120000
      - runFlow:
          when:
            notVisible:
              id: 'chat-room-screen'
          commands:
            - scrollUntilVisible:
                element:
                  text: ${ROOM_NAME}
                direction: DOWN
                timeout: 15000
                optional: true
            - tapOn:
                text: ${ROOM_NAME}
                optional: true
            - extendedWaitUntil:
                visible:
                  id: 'chat-room-screen'
                timeout: 30000
- assertVisible:
    id: 'chat-room-screen'
