appId: com.symply.budget
tags:
  - util
  - app:budget
---
# Opens the Budget household-chat rooms list from anywhere in the app.
# Prefer the floating FAB; fall back to the /budget-chat deep link when the FAB
# is obscured or the driver missed the tap.
- runFlow: go-budget-tab.yaml
- runFlow: budget-dismiss-welcome-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: 'budget-chat-fab'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: 'budget-chat-fab'
    commands:
      - tapOn:
          id: 'budget-chat-fab'
          retryTapIfNoChange: true
- runFlow:
    when:
      notVisible:
        id: 'chat-rooms-screen'
    commands:
      - openLink: simplebudget:///budget-chat
      - runFlow: budget-dismiss-expo-dev-chrome.yaml
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: 'chat-rooms-screen'
    timeout: 45000
# Household store can lag on fresh worker sims — wait for rooms UI, not "No home selected".
- extendedWaitUntil:
    notVisible: 'No home selected'
    timeout: 60000
    optional: true
- extendedWaitUntil:
    visible:
      id: 'chat-rooms-new-button'
    timeout: 60000
    optional: true
# Pull to refresh only when NEITHER the new-room button nor a room row is up.
# This was written as two `notVisible:` keys in one `when:` map — YAML keeps the
# last, so the new-button condition was silently dropped and the swipe fired
# whenever a room was missing, even with the screen fully loaded. `when:` takes
# one condition of each kind, so "neither" has to be nested.
- runFlow:
    when:
      notVisible:
        id: 'chat-rooms-new-button'
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'chat-rooms-first-room'
          commands:
            - swipe:
                direction: DOWN
                element:
                  id: 'chat-rooms-screen'
                optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - openLink: simplebudget:///budget-chat
      - runFlow: budget-dismiss-expo-dev-chrome.yaml
      - extendedWaitUntil:
          visible:
            id: 'chat-rooms-new-button'
          timeout: 45000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: 'chat-rooms-new-button'
            visible:
              id: 'chat-rooms-empty-new-button'
          commands:
            - tapOn:
                id: 'chat-rooms-empty-new-button'
                optional: true
