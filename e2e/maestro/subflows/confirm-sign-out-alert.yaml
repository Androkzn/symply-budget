appId: com.symply.house
tags:
  - util
  - app:house
---
# iOS UIAlert has title + destructive button both labelled "Sign Out" — tap the button.
- extendedWaitUntil:
    visible: 'Are you sure you want to sign out?'
    timeout: 10000
- tapOn:
    text: 'Sign Out'
    index: 1
    optional: true
- runFlow:
    when:
      visible: 'Are you sure you want to sign out?'
    commands:
      - tapOn:
          point: '72%, 58%'
- waitForAnimationToEnd:
    timeout: 5000
