appId: com.symply.budget
tags:
  - util
  - app:budget
---
# Opens the "More" tab (SettingsScreen). `settings` is a default-pinned Budget
# bottom tab → tab-settings → SettingsNavigator root SettingsMain (settings-screen).
- runFlow: budget-dismiss-welcome-if-needed.yaml
- runFlow: budget-recover-dashboard.yaml
- runFlow:
    when:
      notVisible:
        id: 'settings-screen'
    commands:
      - repeat:
          times: 3
          commands:
            - tapOn:
                id: 'nav-back-button'
                optional: true
            - waitForAnimationToEnd:
                timeout: 1500
      - openLink: simplebudget:///settings
      - runFlow: budget-dismiss-expo-dev-chrome.yaml
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      notVisible:
        id: 'settings-screen'
    commands:
      - tapOn:
          id: 'tab-settings'
          retryTapIfNoChange: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'settings-screen'
    timeout: 60000
