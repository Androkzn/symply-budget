appId: com.symply.house
tags:
  - util
---
# Profile → Household & Members → first property card → tabbed property detail.
#
# The row moved off the More tab with the rest of the account rows when House's
# settings went behind the header gear; the id did not change.
#
# There is no deep link to PropertyDetail: SettingsNavigator's NavigationHandler
# only dispatches FloorPlanViewer and ApplianceDetail, so simplehouse://settings
# ?screen=PropertyDetail is a no-op. UI navigation is the only route in.
#
# Taps `household-card-0` rather than a screen coordinate — the older flows used
# `point: '50%,45%'` and `text: 'Active'`, both of which break as soon as the
# list scrolls or the active property changes.
- runFlow: open-profile.yaml
- scrollUntilVisible:
    element:
      id: 'settings-row-household-members'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'settings-row-household-members'
- extendedWaitUntil:
    visible: 'My Properties'
    timeout: 20000
- tapOn:
    id: 'household-card-0'
- extendedWaitUntil:
    visible:
      id: 'property-detail-screen'
    timeout: 20000
